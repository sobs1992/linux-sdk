# Wi-Fi networks for wlan0 (started by /etc/init.d/S41wifi). bare_app's
# Wi-Fi screen adds and removes networks here (update_config=1). By hand:
#   wpa_passphrase "MySSID" "password" >> /etc/wpa_supplicant.conf
#   /etc/init.d/S41wifi restart
ctrl_interface=/var/run/wpa_supplicant
update_config=1
