// What changed in gamepad.cfg since the layout a player's wolfconfig.cfg
// was made with (its pad_layout below gamepad.cfg's pad_layout_current):
// run once after that config (iortcw patch 0006), over its bindings.

// layout 2: Y the binoculars instead of sprint, which the left stick
// pushed all the way does; F-keys without debug lines
bind PAD0_Y "+zoom"
seta j_stickSprint "0.9"
seta in_keyboardDebug "0"
