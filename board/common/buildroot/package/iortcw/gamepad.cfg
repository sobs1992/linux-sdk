// The gamepad of a handheld (SDL game controller, bare_app's buttons by
// label): run after the game's default.cfg (iortcw patch 0004), at the
// start and when a menu puts the controls back to their defaults. The
// game's own Controls menu changes these, wolfconfig.cfg keeps them.

seta in_joystick "1"
// the layout of this file: a player's config that keeps an older one
// (pad_layout, none before 2) gets gamepad-update.cfg once after it
// (patch 0006), which then keeps this one
set pad_layout_current "2"
// F-keys pressed show no debug lines of theirs
seta in_keyboardDebug "0"
seta in_joystickUseAnalog "1"
seta joy_threshold "0.15"

// aim assist as DOOM 3 BFG's (patch 0005): the stick turns slower over an
// enemy, the view follows it a little while the player moves
seta cg_aimAssist "1"

// sticks: the left one moves, the right one turns and looks; the speed
// goes with the tilt (full speed and 200 degrees a second at full tilt)
seta j_forward "-0.0045"
seta j_side "0.0045"
seta j_yaw "-0.0062"
seta j_pitch "0.0048"
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"

// R1 fire, L1 reload, L2/R2 previous/next weapon
bind PAD0_RIGHTSHOULDER "+attack"
bind PAD0_LEFTSHOULDER "+reload"
bind PAD0_LEFTTRIGGER "weapprev"
bind PAD0_RIGHTTRIGGER "weapnext"

// A use, B jump, X crouch, Y the binoculars; the left stick pushed all
// the way sprints (no stick to press: iortcw patch 0006)
bind PAD0_A "+activate"
bind PAD0_B "+moveup"
bind PAD0_X "+movedown"
bind PAD0_Y "+zoom"
seta j_stickSprint "0.9"

// D-pad: up the weapon's other mode (scope, silencer...), down kick,
// left and right lean
bind PAD0_DPAD_UP "weapalt"
bind PAD0_DPAD_DOWN "+kick"
bind PAD0_DPAD_LEFT "+leanleft"
bind PAD0_DPAD_RIGHT "+leanright"

// Start the menu, Back the notebook (bare_app: F1 and F4)
bind PAD0_START "togglemenu"
bind PAD0_BACK "notebook"

// A device's own changes to these (another layout of its buttons and
// sticks: the GO Advance has one stick) in a gamepad-device.cfg of any
// search path (its games card's main/); none here: the console's
// "couldn't exec" only
exec gamepad-device.cfg
