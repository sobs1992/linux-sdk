// Gamepad layout for the ODROID-GO Ultra (bare_app names it in
// XASH3D_GAMEPAD_PRESET), as the SDK's shooters have it (DOOM 3's, RTCW's):
// A use, B jump, X duck, Y flashlight, L1 reload, R1 fire, L2/R2 the
// previous/next weapon at once. The left stick walks, the right one looks;
// the d-pad: up the secondary fire, down the last weapon, left walking
// slowly, right the spray. Its row of F keys: Start (F1) the menu, Back
// (F2) quick load, F6 (F3) quick save, F7 (F4) pause.
joy_unbindall

// face buttons
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "+duck"
bind "Y_BUTTON" "impulse 100"

// shoulders
bind "L1_BUTTON" "+reload"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "invprev"
bind "R2_BUTTON" "invnext"

// dpad
bind "DPAD_UP" "+attack2"
bind "DPAD_DOWN" "lastinv"
bind "DPAD_LEFT" "+speed"
bind "DPAD_RIGHT" "impulse 201"

bind "BACK" "loadquick"
bind "START" "cancelselect"
bind "F6" "savequick"
bind "F7" "pause"

// the weapon taken as soon as it is picked
hud_fastswitch 1

// the engine's own sticks: left side and forward, right pitch and yaw
joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
