// Gamepad layout for the ODROID-GO Advance (bare_app names it in
// XASH3D_GAMEPAD_PRESET). It has a single stick: the stick turns the view
// and the d-pad walks. Weapons move from the d-pad to L2 (next weapon, R1
// takes it); walking slowly is ducking. Its row of F keys is Start (F1),
// Back (F2), quick save (F3) and quick load (F4). Rev 1.0 has no L2 and R2.
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+use"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "impulse 100"

// shoulders
bind "L1_BUTTON" "+duck"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "invnext"
bind "R2_BUTTON" "+attack2"

// dpad
bind "DPAD_UP" "+forward"
bind "DPAD_DOWN" "+back"
bind "DPAD_LEFT" "+moveleft"
bind "DPAD_RIGHT" "+moveright"

bind "BACK" "pause"
bind "START" "cancelselect"

// the stick (side and forward axes) turns: yaw and pitch; a second stick
// (the GO Super's) walks
joy_axis_binding "ypfsrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
