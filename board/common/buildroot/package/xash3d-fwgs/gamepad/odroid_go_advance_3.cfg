// Gamepad layout for the ODROID-GO Advance (bare_app names it in
// XASH3D_GAMEPAD_PRESET), as the SDK's shooters have it (DOOM 3's, RTCW's):
// A use, B jump, X duck, Y flashlight, R1 fire, L2/R2 the previous/next
// weapon at once; but, as on the GO Ultra (odroid_go_ultra_2), L1 the
// secondary fire (six weapons have one and it is used often: the MP5's
// grenade on the move). It has a single stick: the stick turns the view
// and the d-pad walks. Its row of F keys: Start (F1) the menu, Back (F2)
// quick load, F6 (F3) quick save, F7 (F4) the reload, which the weapons
// do by themselves when empty. Rev 1.0 has no L2 and R2. Version 3: the
// engine (patch 0013) applies it over odroid_go_advance_2 and
// odroid_go_advance (L1 reload, F4 the secondary fire).
joy_unbindall

// face buttons
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "+duck"
bind "Y_BUTTON" "impulse 100"

// shoulders
bind "L1_BUTTON" "+attack2"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "invprev"
bind "R2_BUTTON" "invnext"

// dpad
bind "DPAD_UP" "+forward"
bind "DPAD_DOWN" "+back"
bind "DPAD_LEFT" "+moveleft"
bind "DPAD_RIGHT" "+moveright"

bind "BACK" "loadquick"
bind "START" "cancelselect"
bind "F6" "savequick"
bind "F7" "+reload"

// the weapon taken as soon as it is picked
hud_fastswitch 1

// the stick (side and forward axes) turns: yaw and pitch; a second stick
// (the GO Super's) walks
joy_axis_binding "ypfsrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
