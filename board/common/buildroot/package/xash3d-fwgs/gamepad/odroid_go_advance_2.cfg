// Gamepad layout for the ODROID-GO Advance (bare_app names it in
// XASH3D_GAMEPAD_PRESET), as the SDK's shooters have it (DOOM 3's, RTCW's):
// A use, B jump, X duck, Y flashlight, L1 reload, R1 fire, L2/R2 the
// previous/next weapon at once. It has a single stick: the stick turns the
// view and the d-pad walks. Its row of F keys: Start (F1) the menu, Back
// (F2) quick load, F6 (F3) quick save, F7 (F4) the secondary fire. Rev 1.0
// has no L2 and R2. Version 2: the engine (patch 0013) applies it over
// odroid_go_advance, version 1.
joy_unbindall

// face buttons
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "+duck"
bind "Y_BUTTON" "impulse 100"

// shoulders
bind "L1_BUTTON" "+reload"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "invprev"
bind "R2_BUTTON" "invnext"

// dpad
bind "DPAD_UP" "+forward"
bind "DPAD_DOWN" "+back"
bind "DPAD_LEFT" "+moveleft"
bind "DPAD_RIGHT" "+moveright"

bind "BACK" "loadquick"
bind "START" "cancelselect"
bind "F6" "savequick"
bind "F7" "+attack2"

// the weapon taken as soon as it is picked
hud_fastswitch 1

// the stick (side and forward axes) turns: yaw and pitch; a second stick
// (the GO Super's) walks
joy_axis_binding "ypfsrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
