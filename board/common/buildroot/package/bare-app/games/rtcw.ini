; Return to Castle Wolfenstein, single player, by iortcw (package iortcw),
; an SDL2 game: OpenGL drawn by the GPU through SDL's bareapp driver, the
; gamepad as an SDL game controller (bindings: the engine's gamepad.cfg,
; changed in the game's own Controls menu). Game files: main/ of a bought
; copy in /games/rtcw (fs_gogpath: one of the engine's search paths);
; settings and saved games in /data/rtcw (fs_homepath).
name = Return to Castle Wolfenstein
exe = /usr/bin/iowolfsp
args = +set fs_gogpath /games/rtcw +set fs_homepath {data} +set r_mode -1 +set r_customwidth {width} +set r_customheight {height} +set r_fullscreen 1
needs = /games/rtcw/main/pak0.pk3
needs = /games/rtcw/main/sp_pak1.pk3
; made by scripts/games-image.py (games/games.manifest)
cover = /games/rtcw/cover.png
; buttons by label (gamepad.cfg): R1 fire, L1 reload, L2/R2 previous/next
; weapon, A use, B jump, X crouch, Y sprint, D-pad up the weapon's other
; mode, down kick, left/right lean; F1 Start (the menu), F4 Back (the
; notebook); F2 and F3 are the keys of the game's default.cfg: F9 quick
; load, F5 quick save. In the menus: D-pad or left stick and A, B back, the
; right stick moves the pointer
gamepad = f1=start, f2=none, f3=none, f4=back
keys = f2=F9, f3=F5
hint = R1  fire    L1  reload    L2/R2  weapon    A  use    B  jump    X  crouch    Y  sprint\nF1  menu    F2  quick load    F3  quick save    F4  notebook    F5  minimise    F6 (hold)  quit
hint.ru = R1  огонь    L1  перезарядка    L2/R2  оружие    A  действие    B  прыжок    X  присесть    Y  бег\nF1  меню    F2  загрузка    F3  сохранение    F4  блокнот    F5  свернуть    F6 (держать)  выйти
scale = fit
; the motion sensor turns the view: a mouse count is m_yaw 0.022 * sensitivity 5 degrees
gyro = 9.09

[labels]
; what each control does, in bare_app's controls screen (gamepad.cfg)
stick = walk, menus
rstick = look, pointer in menus
a = use, choose
b = jump, back
x = crouch
y = sprint
l1 = reload
r1 = fire
l2 = previous weapon
r2 = next weapon
up = weapon's other mode
down = kick
left = lean left
right = lean right
f1 = menu, skip
f2 = quick load
f3 = quick save
f4 = notebook

[labels.ru]
stick = ходьба, меню
rstick = обзор, указатель в меню
a = действие, выбор
b = прыжок, назад
x = присесть
y = бег
l1 = перезарядка
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = режим оружия
down = удар ногой
left = наклон влево
right = наклон вправо
f1 = меню, пропуск
f2 = быстрая загрузка
f3 = быстрое сохранение
f4 = блокнот
