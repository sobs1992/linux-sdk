; DOOM 3 BFG Edition by RBDOOM-3-BFG (package rbdoom3-bfg), an SDL2 game:
; OpenGL drawn by the GPU through SDL's bareapp driver, the gamepad as an
; SDL game controller (the engine's own bindings). Game files: base/ of a
; bought BFG Edition in /games/doom3; settings and saved games in
; /data/doom3 (fs_savepath).
name = DOOM 3 BFG Edition
exe = /usr/bin/rbdoom3bfg
args = +set fs_basepath /games/doom3 +set fs_savepath {data} +set r_fullscreen 1 +set r_vidMode -1 +set r_customWidth {width} +set r_customHeight {height}
needs = /games/doom3/base/_common.resources
; made by scripts/games-image.py (games/games.manifest)
cover = /games/doom3/cover.png
gamepad = f1=start, f2=back
scale = fit
fps = 0

[env]
; the GPU copies (and scales) each picture and it is read back a frame
; later: the game's next frame overlaps the GPU's work on this one
SDL_BAREAPP_GL_ASYNC = 1
