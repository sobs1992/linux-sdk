# bluetoothd on the ODROID-GO Ultra (started with a USB adapter by
# /etc/init.d/S40bluetooth). Everything not here is BlueZ's default.
[General]
Name = ODROID-GO Ultra
# Pairing again with a known device asks nothing: pads that lost their keys
# (reset, paired with another console) pair again without a question
JustWorksRepairing = always
# Paired pads and headphones connect faster when switched on
FastConnectable = true

[Policy]
# An adapter that comes is switched on; bare_app switches it off when
# Bluetooth is off in its settings
AutoEnable = true
