ODROIDGOU-UBOOT-CONFIG

# OdroidLinux SDK, ODROID-GO Ultra. The factory U-Boot 2015.01 on the eMMC
# sources this file from the card it found it on (mmc ${devno}) and runs
# mainline U-Boot from the same card, which then boots extlinux.conf.
# Mainline U-Boot starts as BL33 does: MMU and caches off.
# The factory SD driver sometimes tunes the card badly and multi-block
# reads fail: "mmc rescan" tunes it again. If u-boot.bin cannot be read,
# the factory U-Boot goes on with the next device.

for try in 1 2 3; do
	if load mmc ${devno}:1 0x01000000 u-boot.bin; then
		dcache off
		icache off
		go 0x01000000
	fi
	mmc rescan
done
echo "boot.ini: cannot read u-boot.bin from mmc ${devno}"
