<svg xmlns='http://www.w3.org/2000/svg' width='980' height='470' viewBox='0 0 980 470' font-family='Segoe UI, Noto Sans, DejaVu Sans, Arial, sans-serif'>
<title>Слои bare_app</title>
<defs>
<marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#444'/></marker>
<marker id='dot' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6'><circle cx='5' cy='5' r='4' fill='#444'/></marker>
</defs>
<rect width='980' height='470' fill='white'/>
<rect x='20' y='25' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='48.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>gui/view/lvgl  (и headless)</text>
<text x='370.0' y='65.7' font-size='12' text-anchor='middle' fill='#222'>экраны и виджеты тулкита: home, game, controls, settings, wifi, usb_disk, layers, input_test, motion</text>
<text x='735' y='57' font-size='11' text-anchor='start' font-style='italic' fill='#555'>единственное место с LVGL</text>
<rect x='20' y='89' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='112.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>gui/view/core</text>
<text x='370.0' y='129.7' font-size='12' text-anchor='middle' fill='#222'>поток view: снимки контекста, подписки, геймпад → клавиши UI, захват ввода играми, видеослой, трансляция</text>
<rect x='20' y='153' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='176.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>gui/ctx · action · notify</text>
<text x='370.0' y='193.7' font-size='12' text-anchor='middle' fill='#222'>граница control ↔ view: контекст (снимки), очередь действий, очередь уведомлений</text>
<rect x='20' y='217' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='240.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>gui/control</text>
<text x='370.0' y='257.7' font-size='12' text-anchor='middle' fill='#222'>модули по областям: питание, экран, звук, Wi-Fi, навигация, система, sysmon</text>
<rect x='20' y='281' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='304.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>services · core · stream</text>
<text x='370.0' y='321.7' font-size='12' text-anchor='middle' fill='#222'>шина событий, главный цикл, логический геймпад, математика стика, RTSP/H.264</text>
<rect x='20' y='345' width='700' height='56' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='370.0' y='368.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>hal · drivers · platforms</text>
<text x='370.0' y='385.7' font-size='12' text-anchor='middle' fill='#222'>интерфейсы → реализации (DRM, fbdev, evdev, HID, ALSA, wpa, RK818…) → таблицы плат oga.c / ogu.c / pc.c</text>
<rect x='740' y='110' width='220' height='290' rx='10' fill='#fbe9e7' fill-opacity='0.45' stroke='#c0564a' stroke-width='1.2' stroke-dasharray='8 5'/>
<text x='752' y='128' font-size='13' text-anchor='start' font-weight='bold' fill='#333'>Игры (games/)</text>
<rect x='755' y='140' width='190' height='60' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='850.0' y='148.3' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>struct game_def</text>
<text x='850.0' y='165.3' font-size='11' text-anchor='middle' fill='#222'>реестр games.c:</text>
<text x='850.0' y='182.3' font-size='11' text-anchor='middle' fill='#222'>homm3, halflife, doom,</text>
<text x='850.0' y='199.3' font-size='11' text-anchor='middle' fill='#222'>native (game.ini), wine</text>
<rect x='755' y='215' width='190' height='50' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='850.0' y='226.8' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>game_proc.c</text>
<text x='850.0' y='243.8' font-size='11' text-anchor='middle' fill='#222'>fork/exec, SIGSTOP/SIGCONT,</text>
<text x='850.0' y='260.9' font-size='11' text-anchor='middle' fill='#222'>сокет + memfd (fd 3, 4)</text>
<rect x='755' y='280' width='190' height='50' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='850.0' y='291.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>ini.c</text>
<text x='850.0' y='308.9' font-size='11' text-anchor='middle' fill='#222'>wine.ini / game.ini,</text>
<text x='850.0' y='325.9' font-size='11' text-anchor='middle' fill='#222'>общий диалект</text>
<rect x='755' y='345' width='190' height='45' rx='6' fill='#ffffff' stroke='#555555' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='850.0' y='362.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>Процессы игр</text>
<text x='850.0' y='379.9' font-size='11' text-anchor='middle' fill='#222'>вне адресного пространства</text>
<line x1='720' y1='117' x2='740' y2='117' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='20' y='445' font-size='12' text-anchor='start' fill='#333'>Границу держит сборка: заголовки LVGL подключены только к цели bare_app_view_lvgl; подключение lvgl.h в другом месте ломает сборку.</text>
</svg>
