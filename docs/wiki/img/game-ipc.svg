<svg xmlns='http://www.w3.org/2000/svg' width='980' height='520' viewBox='0 0 980 520' font-family='Segoe UI, Noto Sans, DejaVu Sans, Arial, sans-serif'>
<title>Игра — отдельный процесс: протокол game_ipc.h</title>
<defs>
<marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#444'/></marker>
<marker id='dot' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6'><circle cx='5' cy='5' r='4' fill='#444'/></marker>
</defs>
<rect width='980' height='520' fill='white'/>
<rect x='20' y='20' width='380' height='480' rx='10' fill='#efe9f8' fill-opacity='0.45' stroke='#7a5bb0' stroke-width='1.2' stroke-dasharray='8 5'/>
<text x='32' y='38' font-size='13' text-anchor='start' font-weight='bold' fill='#333'>bare_app (поток view)</text>
<rect x='40' y='55' width='340' height='60' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='210.0' y='72.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>game_proc_start()</text>
<text x='210.0' y='89.2' font-size='12' text-anchor='middle' fill='#222'>fork + exec программы игры; наследуются</text>
<text x='210.0' y='106.2' font-size='12' text-anchor='middle' fill='#222'>fd 3 — сокет SOCK_SEQPACKET, fd 4 — memfd</text>
<rect x='40' y='135' width='340' height='70' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='210.0' y='157.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>Видеослой (DRM-плоскость)</text>
<text x='210.0' y='174.2' font-size='12' text-anchor='middle' fill='#222'>берёт свежий кадр из shm, кладёт на экран;</text>
<text x='210.0' y='191.2' font-size='12' text-anchor='middle' fill='#222'>кадры 60/с, GAME_FRAME_SAME — «ничего не изменилось»</text>
<rect x='40' y='225' width='340' height='70' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='210.0' y='247.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>Геймпад → игра</text>
<text x='210.0' y='264.2' font-size='12' text-anchor='middle' fill='#222'>кнопки и оси после переназначений экрана</text>
<text x='210.0' y='281.2' font-size='12' text-anchor='middle' fill='#222'>«Управление»; клавиатура и мышь USB — как есть</text>
<rect x='40' y='315' width='340' height='80' rx='6' fill='#fffbe6' stroke='#b5a642' stroke-width='1.5'/>
<text x='210.0' y='333.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>bare_app оставляет себе</text>
<text x='210.0' y='350.7' font-size='12' text-anchor='middle' fill='#222'>F5 — свернуть (SIGSTOP), F5 удерж. — монитор,</text>
<text x='210.0' y='367.7' font-size='12' text-anchor='middle' fill='#222'>F6 удерж. 2 с — закрыть (SIGTERM → SIGKILL),</text>
<text x='210.0' y='384.7' font-size='12' text-anchor='middle' fill='#222'>громкость, кнопка питания</text>
<rect x='40' y='415' width='340' height='70' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='210.0' y='437.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>Экран игры</text>
<text x='210.0' y='454.2' font-size='12' text-anchor='middle' fill='#222'>«Загрузка…» до первого кадра, подсказка hint,</text>
<text x='210.0' y='471.2' font-size='12' text-anchor='middle' fill='#222'>«Не найдено: …» по missing(), код выхода</text>
<rect x='430' y='140' width='130' height='110' rx='6' fill='#f3f3f3' stroke='#7a7a7a' stroke-width='1.5'/>
<text x='495.0' y='165.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>memfd</text>
<text x='495.0' y='182.2' font-size='12' text-anchor='middle' fill='#222'>struct game_shm</text>
<text x='495.0' y='199.2' font-size='12' text-anchor='middle' fill='#222'>3 кадра XRGB8888</text>
<text x='495.0' y='216.2' font-size='12' text-anchor='middle' fill='#222'>тройной буфер</text>
<text x='495.0' y='233.2' font-size='12' text-anchor='middle' fill='#222'>без блокировок</text>
<rect x='430' y='270' width='130' height='90' rx='6' fill='#f3f3f3' stroke='#7a7a7a' stroke-width='1.5'/>
<text x='495.0' y='293.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>сокет</text>
<text x='495.0' y='310.7' font-size='12' text-anchor='middle' fill='#222'>GAME_MSG_FRAME →</text>
<text x='495.0' y='327.7' font-size='12' text-anchor='middle' fill='#222'>← BUTTON, AXIS,</text>
<text x='495.0' y='344.7' font-size='12' text-anchor='middle' fill='#222'>← KEY, MOUSE_*</text>
<line x1='400' y1='170' x2='430' y2='170' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<line x1='400' y1='300' x2='430' y2='300' stroke='#444' stroke-width='1.2' marker-end='url(#arr)' marker-start='url(#dot)'/>
<rect x='590' y='20' width='370' height='480' rx='10' fill='#fbe9e7' fill-opacity='0.45' stroke='#c0564a' stroke-width='1.2' stroke-dasharray='8 5'/>
<text x='602' y='38' font-size='13' text-anchor='start' font-weight='bold' fill='#333'>Процесс игры (своя лицензия, свой цикл)</text>
<rect x='610' y='55' width='330' height='50' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='775.0' y='75.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>game_ipc_client.h (MIT, только заголовок)</text>
<text x='775.0' y='92.7' font-size='12' text-anchor='middle' fill='#222'>game_link_open → recv → draw → publish</text>
<rect x='610' y='120' width='155' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='687.5' y='141.8' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>bare_app_doom</text>
<text x='687.5' y='158.8' font-size='11' text-anchor='middle' fill='#222'>doomgeneric, GPLv2</text>
<text x='687.5' y='175.8' font-size='11' text-anchor='middle' fill='#222'>рисует 320×200</text>
<rect x='785' y='120' width='155' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='862.5' y='141.8' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>VCMI (Герои III)</text>
<text x='862.5' y='158.8' font-size='11' text-anchor='middle' fill='#222'>патч 0001 клиента</text>
<text x='862.5' y='175.8' font-size='11' text-anchor='middle' fill='#222'>окно 854×600 → fit</text>
<rect x='610' y='205' width='155' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='687.5' y='226.8' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>Xash3D FWGS</text>
<text x='687.5' y='243.8' font-size='11' text-anchor='middle' fill='#222'>платформа bare_app</text>
<text x='687.5' y='260.9' font-size='11' text-anchor='middle' fill='#222'>GLES офскрин / soft</text>
<rect x='785' y='205' width='155' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='862.5' y='226.8' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>SDL2-игра как есть</text>
<text x='862.5' y='243.8' font-size='11' text-anchor='middle' fill='#222'>драйверы bareapp</text>
<text x='862.5' y='260.9' font-size='11' text-anchor='middle' fill='#222'>video + joystick</text>
<rect x='610' y='290' width='330' height='90' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='775.0' y='313.4' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>bare_app_wine (ports/wine)</text>
<text x='775.0' y='330.4' font-size='11' text-anchor='middle' fill='#222'>wine.ini → Wine WoW64 + Box64 → игра .exe;</text>
<text x='775.0' y='347.4' font-size='11' text-anchor='middle' fill='#222'>winebare.drv каждого процесса Wine отдаёт пиксели окон,</text>
<text x='775.0' y='364.4' font-size='11' text-anchor='middle' fill='#222'>мост собирает экран Windows, рисует курсор, масштабирует</text>
<rect x='610' y='395' width='330' height='90' rx='6' fill='#fffbe6' stroke='#b5a642' stroke-width='1.5'/>
<text x='775.0' y='418.4' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>Что получает игра</text>
<text x='775.0' y='435.4' font-size='11' text-anchor='middle' fill='#222'>размер слоя (854×480 / 480×320), ALSA PCM платы,</text>
<text x='775.0' y='452.4' font-size='11' text-anchor='middle' fill='#222'>язык (en/ru), каталог данных /data/&lt;игра&gt;,</text>
<text x='775.0' y='469.4' font-size='11' text-anchor='middle' fill='#222'>/games только для чтения</text>
<line x1='560' y1='195' x2='590' y2='195' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<line x1='560' y1='315' x2='590' y2='315' stroke='#444' stroke-width='1.2' marker-end='url(#arr)' marker-start='url(#dot)'/>
</svg>
