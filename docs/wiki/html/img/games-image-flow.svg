<text x='310' y='102.2' font-size='12' text-anchor='start' font-weight='bold' fill='#222'>games-image.py</text>
<text x='310' y='119.2' font-size='12' text-anchor='start' fill='#222'></text>
<text x='310' y='136.2' font-size='12' text-anchor='start' fill='#222'>1. install: copy / homm3 / halflife / none</text>
<text x='310' y='153.2' font-size='12' text-anchor='start' fill='#222'>   минус exclude</text>
<text x='310' y='170.2' font-size='12' text-anchor='start' fill='#222'>2. file → в каталог игры</text>
<text x='310' y='187.2' font-size='12' text-anchor='start' fill='#222'>3. overlay поверх</text>
<text x='310' y='204.2' font-size='12' text-anchor='start' fill='#222'>4. run prepare.sh</text>
<text x='310' y='221.2' font-size='12' text-anchor='start' fill='#222'>   (GAME_DIR, SOURCE, SDK_DIR, DATA_DIR, env)</text>
<text x='310' y='238.2' font-size='12' text-anchor='start' fill='#222'>5. cover → cover.png 240×240</text>
<text x='310' y='255.2' font-size='12' text-anchor='start' fill='#222'>   из png / .lod / .wad / .exe:icon / .bik:сек</text>
<text x='310' y='272.2' font-size='12' text-anchor='start' fill='#222'>6. проверка места</text>
<text x='310' y='289.2' font-size='12' text-anchor='start' fill='#222'>7. rsync -rt на карту (только изменившееся)</text>
<text x='310' y='306.2' font-size='12' text-anchor='start' fill='#222'>8. data → /data платы по ssh (--board)</text>
