<svg xmlns='http://www.w3.org/2000/svg' width='980' height='540' viewBox='0 0 980 540' font-family='Segoe UI, Noto Sans, DejaVu Sans, Arial, sans-serif'>
<title>Windows-игра на GO Ultra: стек Wine</title>
<defs>
<marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#444'/></marker>
<marker id='dot' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6'><circle cx='5' cy='5' r='4' fill='#444'/></marker>
</defs>
<rect width='980' height='540' fill='white'/>
<rect x='20' y='30' width='300' height='70' rx='6' fill='#efe9f8' stroke='#7a5bb0' stroke-width='1.5'/>
<text x='170.0' y='52.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>bare_app · src/games/wine.c</text>
<text x='170.0' y='69.2' font-size='12' text-anchor='middle' fill='#222'>каждый /games/&lt;id&gt;/wine.ini — плитка меню;</text>
<text x='170.0' y='86.2' font-size='12' text-anchor='middle' fill='#222'>запускает bare_app_wine &lt;каталог игры&gt;</text>
<rect x='20' y='130' width='300' height='110' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='170.0' y='155.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>bare_app_wine (ports/wine, ~2800 строк C)</text>
<text x='170.0' y='172.2' font-size='12' text-anchor='middle' fill='#222'>читает wine.ini, готовит префикс (wineboot),</text>
<text x='170.0' y='189.2' font-size='12' text-anchor='middle' fill='#222'>диск D: = родитель каталога игры,</text>
<text x='170.0' y='206.2' font-size='12' text-anchor='middle' fill='#222'>собирает окна в экран Windows, курсор,</text>
<text x='170.0' y='223.2' font-size='12' text-anchor='middle' fill='#222'>масштаб (aspect/fill, rows, gamma), [keys]</text>
<line x1='170' y1='100' x2='170' y2='130' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='20' y='270' width='300' height='90' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='170.0' y='293.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>Wine 11.0 WoW64 (пакет wine-wow64)</text>
<text x='170.0' y='310.7' font-size='12' text-anchor='middle' fill='#222'>Unix-часть и 64-битные DLL — aarch64,</text>
<text x='170.0' y='327.7' font-size='12' text-anchor='middle' fill='#222'>32-битные DLL — i386 (llvm-mingw),</text>
<text x='170.0' y='344.7' font-size='12' text-anchor='middle' fill='#222'>25 патчей SDK</text>
<line x1='170' y1='240' x2='170' y2='270' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='170.0' y='252.0' font-size='12' text-anchor='middle' fill='#333'>WINEBARE_SOCKET, окружение env =</text>
<rect x='20' y='390' width='140' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='90.0' y='411.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>wowbox64.dll</text>
<text x='90.0' y='428.9' font-size='11' text-anchor='middle' fill='#222'>Box64: x86 → arm64</text>
<text x='90.0' y='445.9' font-size='11' text-anchor='middle' fill='#222'>BIGBLOCK, CALLRET</text>
<rect x='180' y='390' width='140' height='70' rx='6' fill='#fbe9e7' stroke='#c0564a' stroke-width='1.5'/>
<text x='250.0' y='411.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>winebare.drv</text>
<text x='250.0' y='428.9' font-size='11' text-anchor='middle' fill='#222'>драйвер экрана/ввода</text>
<text x='250.0' y='445.9' font-size='11' text-anchor='middle' fill='#222'>пиксели окон → мост</text>
<line x1='90' y1='360' x2='90' y2='390' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<line x1='250' y1='360' x2='250' y2='390' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<line x1='250' y1='460' x2='250' y2='490' stroke='#444' stroke-width='1.6' stroke-linecap='square'/>
<line x1='250' y1='490' x2='360' y2='490' stroke='#444' stroke-width='1.6' stroke-linecap='square'/>
<line x1='360' y1='490' x2='360' y2='185' stroke='#444' stroke-width='1.6' stroke-linecap='square'/>
<line x1='360' y1='185' x2='320' y2='185' stroke='#444' stroke-width='1.6' stroke-linecap='square' marker-end='url(#arr)'/>
<text x='450' y='484' font-size='12' text-anchor='middle' fill='#333'>пиксели, курсор, гамма</text>
<rect x='400' y='30' width='260' height='70' rx='6' fill='#ffffff' stroke='#555555' stroke-width='1.5'/>
<text x='530.0' y='52.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>Игра .exe (x86-32)</text>
<text x='530.0' y='69.2' font-size='12' text-anchor='middle' fill='#222'>Direct3D 8/9, DirectDraw, GDI,</text>
<text x='530.0' y='86.2' font-size='12' text-anchor='middle' fill='#222'>DirectInput, DirectSound</text>
<rect x='400' y='130' width='260' height='110' rx='6' fill='#fdf3e0' stroke='#c48a2a' stroke-width='1.5'/>
<text x='530.0' y='155.2' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>WineD3D → OpenGL</text>
<text x='530.0' y='172.2' font-size='12' text-anchor='middle' fill='#222'>Mesa 25.0 panfrost (пакет mesa-panfrost,</text>
<text x='530.0' y='189.2' font-size='12' text-anchor='middle' fill='#222'>5 патчей; PAN_MMAP_WINDOW для WoW64)</text>
<text x='530.0' y='206.2' font-size='12' text-anchor='middle' fill='#222'>WINE_D3D_CONFIG=HeapMaps, SysmemMaps,</text>
<text x='530.0' y='223.2' font-size='12' text-anchor='middle' fill='#222'>GLStateCache; WINE_FAST_MUTEX</text>
<line x1='530' y1='100' x2='530' y2='130' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='400' y='270' width='260' height='60' rx='6' fill='#e9f6ea' stroke='#4f9a56' stroke-width='1.5'/>
<text x='530.0' y='295.7' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>GPU Mali-G52 (G12B)</text>
<text x='530.0' y='312.7' font-size='12' text-anchor='middle' fill='#222'>рендер в буфер вне экрана</text>
<line x1='530' y1='240' x2='530' y2='270' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='700' y='20' width='260' height='500' rx='10' fill='#f3f3f3' fill-opacity='0.45' stroke='#7a7a7a' stroke-width='1.2' stroke-dasharray='8 5'/>
<text x='712' y='38' font-size='13' text-anchor='start' font-weight='bold' fill='#333'>Файловые системы</text>
<rect x='715' y='50' width='230' height='90' rx='6' fill='#f3f3f3' stroke='#7a7a7a' stroke-width='1.5'/>
<text x='830.0' y='73.3' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>/games/&lt;id&gt;/ (exFAT, ro)</text>
<text x='830.0' y='90.3' font-size='11' text-anchor='middle' fill='#222'>игра как установлена + wine.ini,</text>
<text x='830.0' y='107.3' font-size='11' text-anchor='middle' fill='#222'>redist DLL рядом (dlls = …=n,b),</text>
<text x='830.0' y='124.3' font-size='11' text-anchor='middle' fill='#222'>cover.png; имена без регистра</text>
<rect x='715' y='160' width='230' height='90' rx='6' fill='#f3f3f3' stroke='#7a7a7a' stroke-width='1.5'/>
<text x='830.0' y='183.3' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>/data/wine/prefix (ext4)</text>
<text x='830.0' y='200.3' font-size='11' text-anchor='middle' fill='#222'>один префикс на все игры:</text>
<text x='830.0' y='217.3' font-size='11' text-anchor='middle' fill='#222'>реестр, диск C:, шрифты Windows,</text>
<text x='830.0' y='234.3' font-size='11' text-anchor='middle' fill='#222'>Documents игр, prefs</text>
<rect x='715' y='270' width='230' height='100' rx='6' fill='#f3f3f3' stroke='#7a7a7a' stroke-width='1.5'/>
<text x='830.0' y='289.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>/data/wine/games/&lt;dir&gt;</text>
<text x='830.0' y='306.9' font-size='11' text-anchor='middle' fill='#222'>копия каталога игры для «writable»:</text>
<text x='830.0' y='323.9' font-size='11' text-anchor='middle' fill='#222'>перечисленные записи — копии,</text>
<text x='830.0' y='340.9' font-size='11' text-anchor='middle' fill='#222'>остальное — ссылки на /games;</text>
<text x='830.0' y='357.9' font-size='11' text-anchor='middle' fill='#222'>первый запуск копирует</text>
<rect x='715' y='390' width='230' height='110' rx='6' fill='#fffbe6' stroke='#b5a642' stroke-width='1.5'/>
<text x='830.0' y='414.9' font-size='11' text-anchor='middle' font-weight='bold' fill='#222'>Патчи Wine 0013/0023/0024</text>
<text x='830.0' y='431.9' font-size='11' text-anchor='middle' fill='#222'>файлы на ro-ФС открываются</text>
<text x='830.0' y='448.9' font-size='11' text-anchor='middle' fill='#222'>как read-only без ошибок;</text>
<text x='830.0' y='465.9' font-size='11' text-anchor='middle' fill='#222'>поиск имён через stat() на FAT/exFAT</text>
<text x='830.0' y='482.9' font-size='11' text-anchor='middle' fill='#222'>(каталоги большие)</text>
<line x1='660' y1='65' x2='715' y2='65' stroke='#888' stroke-width='1.2' marker-end='url(#arr)' stroke-dasharray='6 4'/>
</svg>
