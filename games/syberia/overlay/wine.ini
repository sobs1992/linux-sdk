; Syberia (2002, Microids, Virtools, Direct3D 7), the Russian edition 1.0
; (Nival), under Wine for the GO Ultra (games/syberia/README.md).
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/syberia/wine.ini.
name = Syberia
hint = L stick  cursor    A  click    B  inventory and menu, skip a video (Esc)    Y  right click    F5  minimise    F6 (hold)  quit\nIn the menus: Back (bottom left) by the cursor: B does not leave them    save: B, Menu, Save, a slot
hint.ru = Л. стик  курсор    A  клик    B  инвентарь и меню, пропуск ролика (Esc)    Y  правый клик    F5  свернуть    F6 (держать)  выход\nВ меню «Назад» (внизу слева) — курсором: B их не закрывает    запись: B, «Меню», «Сохранение», слот
exe = Syberia.exe
; its saved games and settings in the Windows profile (the options screen
; deletes them with "Delete saved games and settings")
saves = Documents/Syberia Saves
; The game plays at 800x600 (16-bit, its Config.dat in My Documents),
; shown whole on the 854x480 screen (640x480 with bars at the sides): its
; picture is the whole scene, cursor and inventory included
mode = 800x600
locale = ru_RU
; Saved games and Config.dat in My Documents ("Syberia Saves"): none
; written into the game's directory
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1
; The frame limit unless the game's options (Y on its tile) choose
; another: the game's scenes are still pictures with animated people, 30
; a second as the game's own cinematics
fps_limit = 30

[keys]
stick = mouse
; across the screen in about two seconds
cursor_speed = 1.2
a = lbutton
b = esc
f1 = esc
y = rbutton
; Not used by the game: nothing, rather than wine.ini's defaults (the
; arrows, Enter, PgUp/PgDn, Shift, Ctrl, F2-F4). The right stick stays the
; wheel
up = none
down = none
left = none
right = none
x = none
l1 = none
r1 = none
l2 = none
r2 = none
f2 = none
f3 = none
f4 = none

[labels]
stick = cursor
a = click
b = inventory and menu, skip a video (Esc)
y = right click
f1 = menu, skip a video

[labels.ru]
stick = курсор
a = клик
b = инвентарь и меню, пропуск ролика (Esc)
y = правый клик
f1 = меню, пропуск ролика
