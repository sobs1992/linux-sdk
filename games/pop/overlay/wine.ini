; Prince of Persia: The Sands of Time (2003, Ubisoft Montreal, Jade engine,
; Direct3D 9) under Wine for the GO Ultra, the GOG edition ("181 GOG v2",
; English). bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini
; explains every key); goes to /games/pop/wine.ini.
name = Prince of Persia: The Sands of Time
hint = L stick  run    R stick  camera, menu pointer    R1 / A  sword    B  jump    X  drop    Y  rewind (+L1 forward)\nL1  wall run, block    R2  dagger    L2  walk    F1  menu    F2  view    F4  look\nThe game's keys: WASD = L stick, Space = B, mouse = R1/L1, R = Y, E = R2, Shift = L2, C = X; menus: the dagger's tip on the word, A
hint.ru = Л. стик  бег    П. стик  камера, указатель меню    R1 / A  меч    B  прыжок    X  отпустить    Y  перемотка (+L1 вперёд)\nL1  бег по стене, блок    R2  кинжал    L2  шагом    F1  меню    F2  вид    F4  осмотр\nклавиши игры: WASD — Л. стик, пробел — B, мышь — R1/L1, R — Y, E — R2, Shift — L2, C — X; меню: остриё на слово, A
; poplaunch.exe (games/pop/poplaunch.c, made by prepare.sh): POP.EXE
; started as its launcher (PrinceOfPersia.EXE, a settings window) would,
; without it. Not GOG's gpp.exe: POP.EXE through GOG's dx.dll and di.dll,
; whose overlay stops the game at its start under Wine. The display mode
; is the profile's (Profiles/prince/Profile.DAT: 800x600)
exe = poplaunch.exe
mode = 800x600
; Profiles (settings, saved games) in the game's directory; POP.LOG and
; PrinceSM (there while the game runs) are written next to them in the
; copy of the directory
writable = Profiles
; The mouse sent as moves, not places: the game reads it by DirectInput
; while Wine holds the Windows cursor in one place, and a place sent was a
; move from there, again with each later move and with a click (the
; dagger jumped off the button clicked)
mouse = relative
dlls = msvcp71,msvcr71,mfc71=n,b
; PAN_MMAP_WINDOW (SDK's Mesa patch 0005): the GPU's buffers mapped below
; 4 GiB, where Wine hands a mapping to the 32-bit game as it is (POP.EXE
; has no /LARGEADDRESSAWARE: 0x80000000 and up is free). WineD3D's
; HeapMaps, SysmemMaps and the fast mutexes as for Pirates!: the profile
; screen (a 3D scene) 29.5 -> 33 fps; the first courtyard ~30 before. The
; game's x86 thread then waits for WineD3D's command stream thread, at
; 100% of a core (the GO Ultra's PS2-like 30 fps)
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 PAN_MMAP_WINDOW=80000000-100000000 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). ~30 fps in play (as on the
; PS2), ~230 in its menus.
fps_limit = 30

[keys]
; The keys of the PC version (manual.pdf, "Control Map"). Its menus take
; the mouse only (the dagger is the pointer; the keys do not move it), so
; the right stick is the mouse there as in play (the camera) and A its
; left button (the sword in play). The left stick runs on W A S D.
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
; the mouse (the right stick, at 0.3 of this) faster for the camera: 0.72
; screen widths a second pushed all the way (0.8: the camera turned slowly)
cursor_speed = 2.4
dpad = arrows
arrows = cursor
; sword (left click), jump (Space), dagger (E), drop (C)
a = lbutton
b = space
x = c
y = r
; As the SDK's shooters (DOOM 3's layout): R1 the sword too, L1 the
; special action (right click: wall run, roll, block), Y rewind (R; with
; L1 held fast forward)
r1 = lbutton
l1 = rbutton
; walk (Left Shift), the dagger (E), camera look (F), the other view (Q)
l2 = lshift
r2 = e
f1 = esc
f2 = q
; Enter: a new profile's name
f3 = enter
f4 = f

[labels]
stick = run
rstick = camera, menu pointer
a = sword, menu choice
r1 = sword
l1 = wall run, roll, block
b = jump
x = drop
y = rewind (+L1 forward)
r2 = dagger
l2 = walk
f1 = menu
f2 = other view
f3 = Enter
f4 = look

[labels.ru]
stick = бег
rstick = камера, указатель меню
a = меч, выбор в меню
r1 = меч
l1 = бег по стене, кувырок, блок
b = прыжок
x = отпустить
y = перемотка (+L1 вперёд)
r2 = кинжал
l2 = шагом
f1 = меню
f2 = другой вид
f3 = Enter
f4 = осмотр
