; Return to Castle Wolfenstein, single player, by iortcw (package iortcw),
; an SDL2 game: OpenGL drawn by the GPU through SDL's bareapp driver, the
; gamepad as an SDL game controller (bindings: the engine's gamepad.cfg,
; changed in the game's own Controls menu). Game files: main/ of a bought
; copy in this directory, /games/rtcw (fs_gogpath: one of the engine's
; search paths); settings and saved games in /data/rtcw (fs_homepath).
; On the games card with the game (games/games.manifest: overlay), so the
; menu entry comes and goes with the game; the engine is in the image.
name = Return to Castle Wolfenstein
exe = /usr/bin/iowolfsp
args = +set fs_gogpath {dir} +set fs_homepath {data} +set r_mode -1 +set r_customwidth {width} +set r_customheight {height} +set r_fullscreen 1
needs = main/pak0.pk3
needs = main/sp_pak1.pk3
; cover.png (here) is made by scripts/games-image.py
; buttons by label (gamepad.cfg): R1 fire, L1 reload, L2/R2 previous/next
; weapon, A use, B jump, X crouch, Y the binoculars, the left stick pushed
; all the way sprints (iortcw patch 0006), D-pad up the weapon's other
; mode, down kick, left/right lean; F1 Start (the menu), F4 Back (the
; notebook); F2 and F3 are the keys of the game's default.cfg: F9 quick
; load, F5 quick save. In the menus: D-pad or left stick and A, B back, the
; item chosen framed, the right stick moves the pointer; a list of saved
; games: A loads the row chosen, X shows the autosaves or the player's own
gamepad = f1=start, f2=none, f3=none, f4=back
keys = f2=F9, f3=F5
hint = L stick  walk (all the way: sprint)    R1  fire    L1  reload    L2/R2  weapon    A  use    B  jump    X  crouch    Y  binoculars\nLoad game: A on a save loads it, X autosaves    F1  menu    F2  quick load    F3  quick save    F4  notebook    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба (до упора — бег)    R1  огонь    L1  перезарядка    L2/R2  оружие    A  действие    B  прыжок    X  присесть    Y  бинокль\nЗагрузка: A на строке — загрузить, X — автосохранения    F1  меню    F2  загрузка    F3  сохранение    F4  блокнот    F5  свернуть    F6 (держать)  выйти
scale = fit
; the motion sensor turns the view: a mouse count is m_yaw 0.022 * sensitivity 5 degrees
gyro = 9.09
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 60 fps at ~8% of the CPU;
; SDL's vsync (fps) holds it there too.
fps_limit = 60

[labels]
; what each control does, in bare_app's controls screen (gamepad.cfg)
stick = walk (all the way: sprint), menus
rstick = look, pointer in menus
a = use, choose (a save: load it)
b = jump, back
x = crouch (load menu: autosaves)
y = binoculars
l1 = reload
r1 = fire
l2 = previous weapon
r2 = next weapon
up = weapon's other mode
down = kick
left = lean left
right = lean right
f1 = menu, skip
f2 = quick load
f3 = quick save
f4 = notebook

[labels.ru]
stick = ходьба (до упора — бег), меню
rstick = обзор, указатель в меню
a = действие, выбор (сохранение: загрузить)
b = прыжок, назад
x = присесть (загрузка: автосохранения)
y = бинокль
l1 = перезарядка
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = режим оружия
down = удар ногой
left = наклон влево
right = наклон вправо
f1 = меню, пропуск
f2 = быстрая загрузка
f3 = быстрое сохранение
f4 = блокнот
