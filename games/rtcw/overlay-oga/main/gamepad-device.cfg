// The GO Advance (games/oga.manifest): one stick. Run after the engine's
// gamepad.cfg: the stick turns and looks, the D-pad walks (as Half-Life
// on this device); the F keys of game.ini as on the GO Ultra (F2 quick
// load, F3 quick save) but F4 (the controller's back) the weapon's other
// mode, which the D-pad did. Lean, kick, the binoculars and the notebook
// have no button (the game's Controls menu can give them one).

bind PAD0_LEFTSTICK_LEFT "+left"
bind PAD0_LEFTSTICK_RIGHT "+right"
bind PAD0_LEFTSTICK_UP "+lookup"
bind PAD0_LEFTSTICK_DOWN "+lookdown"

bind PAD0_DPAD_UP "+forward"
bind PAD0_DPAD_DOWN "+back"
bind PAD0_DPAD_LEFT "+moveleft"
bind PAD0_DPAD_RIGHT "+moveright"

bind PAD0_BACK "weapalt"
// F3 was the controller's misc1 (the weapon's other mode) up to layout 3
unbind PAD0_MISC1

// Y sprints here (gamepad.cfg's layout 2 makes it the binoculars and runs
// by the moving stick pushed all the way: this one stick looks, the D-pad
// walks, no axis to push)
bind PAD0_Y "+sprint"
seta j_stickSprint "0"

// This device's layout: 3, one over gamepad.cfg's 2 (the F keys above): a
// player's wolfconfig.cfg of an older one gets gamepad-update.cfg once,
// which runs this file again (iortcw patch 0006). A gamepad.cfg of a
// newer layout than 2 must count this one in.
set pad_layout_current "3"
