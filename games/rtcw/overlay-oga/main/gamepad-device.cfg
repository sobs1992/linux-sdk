// The GO Advance (games/oga.manifest): one stick. Run after the engine's
// gamepad.cfg: the stick turns and looks, the D-pad walks (as Half-Life
// on this device); the F keys of game.ini take what the D-pad did:
// F3 (the controller's misc1) the weapon's other mode, F4 (back) the
// notebook. Lean and kick have no button (the game's Controls menu can
// give them one).

bind PAD0_LEFTSTICK_LEFT "+left"
bind PAD0_LEFTSTICK_RIGHT "+right"
bind PAD0_LEFTSTICK_UP "+lookup"
bind PAD0_LEFTSTICK_DOWN "+lookdown"

bind PAD0_DPAD_UP "+forward"
bind PAD0_DPAD_DOWN "+back"
bind PAD0_DPAD_LEFT "+moveleft"
bind PAD0_DPAD_RIGHT "+moveright"

bind PAD0_MISC1 "weapalt"

// Y sprints here (gamepad.cfg's layout 2 makes it the binoculars and runs
// by the moving stick pushed all the way: this one stick looks, the D-pad
// walks, no axis to push)
bind PAD0_Y "+sprint"
seta j_stickSprint "0"
