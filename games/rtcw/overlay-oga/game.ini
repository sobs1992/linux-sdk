; Return to Castle Wolfenstein on the GO Advance (games/oga.manifest): the
; GO Ultra's game.ini (games/rtcw/overlay) for a device with one stick.
; main/gamepad-device.cfg here changes the engine's gamepad.cfg: the stick
; looks, the D-pad walks. Game files: main/ of a bought copy in this
; directory, /games/rtcw (fs_gogpath); settings and saved games in
; /data/rtcw (fs_homepath).
name = Return to Castle Wolfenstein
exe = /usr/bin/iowolfsp
args = +set fs_gogpath {dir} +set fs_homepath {data} +set r_mode -1 +set r_customwidth {width} +set r_customheight {height} +set r_fullscreen 1
needs = main/pak0.pk3
needs = main/sp_pak1.pk3
; cover.png (here) is made by scripts/games-image.py
; F1 Start (the menu), F4 Back (gamepad-device.cfg: the weapon's other
; mode); F2 and F3 are the keys of the game's default.cfg: F9 quick load,
; F5 quick save, as on the GO Ultra. In the menus: D-pad or the stick and
; A, B back, the item chosen framed; a list of saved games: A loads the
; row chosen, X shows the autosaves or the player's own
gamepad = f1=start, f2=none, f3=none, f4=back
keys = f2=F9, f3=F5
hint = Stick  look    D-pad  walk    R1  fire    L1  reload    L2/R2  weapon    A  use    B  jump    X  crouch    Y  sprint\nLoad game: A on a save loads it, X autosaves    F1  menu    F2  quick load    F3  quick save    F4  weapon mode    F5  minimise    F6 (hold)  quit
hint.ru = Стик  обзор    крестовина  ходьба    R1  огонь    L1  перезарядка    L2/R2  оружие    A  действие    B  прыжок    X  присесть    Y  бег\nЗагрузка: A на строке — загрузить, X — автосохранения    F1  меню    F2  загрузка    F3  сохранение    F4  режим оружия    F5  свернуть    F6 (держать)  выйти
scale = fit
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit): 27-30 fps in the first level
fps_limit = 30

[env]
; Panfrost draws into tiled buffers; SDL's bareapp driver reads each frame
; back (glReadPixels) and Mesa untiled it on the CPU, from the GPU's
; uncached memory: 56% of the A35 core the game runs on, 13 fps. Linear
; buffers (Panfrost's debug flag) are read as they are: 27-30 fps. The
; Mali-G31 is not the limit at 480x320.
PAN_MESA_DEBUG = linear

[labels]
stick = look, menus
a = use, choose (a save: load it)
b = jump, back
x = crouch (load menu: autosaves)
y = sprint
l1 = reload
r1 = fire
l2 = previous weapon
r2 = next weapon
up = forward
down = back
left = step left
right = step right
f1 = menu, skip
f2 = quick load
f3 = quick save
f4 = weapon's other mode

[labels.ru]
stick = обзор, меню
a = действие, выбор (сохранение: загрузить)
b = прыжок, назад
x = присесть (загрузка: автосохранения)
y = бег
l1 = перезарядка
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = вперёд
down = назад
left = шаг влево
right = шаг вправо
f1 = меню, пропуск
f2 = быстрая загрузка
f3 = быстрое сохранение
f4 = режим оружия
