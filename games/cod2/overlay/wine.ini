; Call of Duty 2 (2005, Infinity Ward, Direct3D 9), 1C's Russian edition,
; single player, under Wine for the GO Ultra (games/cod2/README.md).
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/cod2/wine.ini.
name = Call of Duty 2
hint = L stick  walk    R stick  look, menu pointer    R1  fire, click    L2 (hold)  aim    L1  reload    A  use, menu: choose    B  jump    X  crouch    Y  grenade\nR2  weapon    D-pad  smoke, prone, lean; menu: items    F1  menu, back    F2  melee    F3  binoculars    F4  objectives    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба    П. стик  обзор, указатель меню    R1  огонь, щелчок    L2 (держать)  прицел    L1  перезарядка    A  действие, в меню выбор    B  прыжок    X  присесть    Y  граната\nR2  оружие    крестовина  дым, лечь, выглянуть; в меню пункты    F1  меню, назад    F2  удар прикладом    F3  бинокль    F4  задачи    F5  свернуть    F6 (держать)  выход
exe = CoD2SP_s.exe
; The profile's r_mode (overlay/main/players/player/config.cfg)
mode = 854x480
modes = 854x480
; The game reads the mouse by DirectInput: moves, not places
mouse = relative
locale = ru_RU
; What the game writes: the profile (its settings and saved games,
; players/player/save), save/ (the temporary save of a level's start) and
; hunkusage.dat (rewritten at each level load). Each failed on the
; read-only card: "cannot create the file hunkusage.dat", "SaveDevice_PC -
; TempSaveGame: cannot open file for saving"
writable = main/players, main/save, main/hunkusage.dat
; VideoMemorySize=2048 (WineD3D's own key): WineD3D takes the GPU for a
; GeForce 6800 with 128 MB, and the second mission's load (Stalingrad,
; demolition) stopped in the menu with "Create2DTexture(snow_sheet...)
; failed: Out of video memory". Only the count: the textures are in the
; device's memory either way. The profile's r_picmip_manual 1 keeps the
; textures the game chose at 128 MB (r_picmip 2): automatic, it would take
; bigger ones for the bigger count
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1,VideoMemorySize=2048 WINE_FAST_MUTEX=1

[keys]
; The game's own keys (the profile's binds), laid out as the other
; shooters: the left stick W A S D, the right stick the mouse that looks
; around and moves the menus' pointer. The menus also go by keys: the
; arrows choose an item (left and right change a setting), Enter takes it;
; the arrows and Enter are bound to nothing in the game, so the D-pad
; sends its key and an arrow, A use (F) and Enter
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
; The right stick's moves: 615 a second at full deflection (0.3 * 2.4 *
; 854). The menus' pointer takes one as a pixel of their 640x480 (1.33 of
; the screen's across): about a second over the screen (at 0.8 it took
; four). In the game the profile's sensitivity 18 and m_pitch 0.0128 make
; them 240 degrees a second around and 140 up and down, as DOOM 3's stick
; (sensitivity 5 at 0.8 was 22 degrees a second)
cursor_speed = 2.4
dpad = arrows
up = 4+up
down = ctrl+down
left = q+left
right = e+right
a = f+enter
b = space
x = c
y = g
l1 = r
r1 = lbutton
l2 = rbutton
r2 = 1
f1 = esc
f2 = shift
f3 = b
f4 = tab

[labels]
stick = walk
rstick = look, menu pointer
up = smoke grenade; menu: item up
down = prone; menu: item down
left = lean left; menu: setting
right = lean right; menu: setting
a = use; menu: choose
b = jump, stand up
x = crouch
y = grenade
l1 = reload
r1 = fire, click in the menus
l2 = aim down the sights (hold)
r2 = other weapon
f1 = menu, back
f2 = melee, hold breath
f3 = binoculars
f4 = objectives (hold)

[labels.ru]
stick = ходьба
rstick = обзор, указатель меню
up = дымовая граната; в меню пункт вверх
down = лечь; в меню пункт вниз
left = выглянуть влево; в меню настройка
right = выглянуть вправо; в меню настройка
a = действие; в меню выбор
b = прыжок, встать
x = присесть
y = граната
l1 = перезарядка
r1 = огонь, щелчок в меню
l2 = прицел (держать)
r2 = другое оружие
f1 = меню, назад
f2 = удар прикладом, задержать дыхание
f3 = бинокль
f4 = задачи (держать)
