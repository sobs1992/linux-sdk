; Call of Duty 2 (2005, Infinity Ward, Direct3D 9), 1C's Russian edition,
; single player, under Wine for the GO Ultra (games/cod2/README.md).
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/cod2/wine.ini.
name = Call of Duty 2
hint = L stick  walk    R stick  look, menu pointer    R1  fire, click    L2  aim    L1  reload    A  use    B  jump    X  crouch    Y  grenade\nR2  weapon    D-pad  smoke, prone, lean    F1  menu    F2  melee    F3  binoculars    F4  objectives    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба    П. стик  обзор, указатель меню    R1  огонь, щелчок    L2  прицел    L1  перезарядка    A  действие    B  прыжок    X  присесть    Y  граната\nR2  оружие    крестовина  дым, лечь, выглянуть    F1  меню    F2  удар прикладом    F3  бинокль    F4  задачи    F5  свернуть    F6 (держать)  выход
exe = CoD2SP_s.exe
; The profile's r_mode (overlay/main/players/player/config.cfg)
mode = 854x480
modes = 854x480
; The game reads the mouse by DirectInput: moves, not places
mouse = relative
locale = ru_RU
; The profile: its settings and saved games (players/player/save)
writable = main/players
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1

[keys]
; The game's own keys (the profile's binds), laid out as the other
; shooters: the left stick W A S D, the right stick the mouse that looks
; around and moves the menus' pointer
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
dpad = arrows
up = 4
down = ctrl
left = q
right = e
a = f
b = space
x = c
y = g
l1 = r
r1 = lbutton
l2 = rbutton
r2 = 1
f1 = esc
f2 = shift
f3 = b
f4 = tab

[labels]
stick = walk
rstick = look, menu pointer
up = smoke grenade
down = prone
left = lean left
right = lean right
a = use
b = jump, stand up
x = crouch
y = grenade
l1 = reload
r1 = fire, click in the menus
l2 = aim down the sights
r2 = other weapon
f1 = menu
f2 = melee, hold breath
f3 = binoculars
f4 = objectives (hold)

[labels.ru]
stick = ходьба
rstick = обзор, указатель меню
up = дымовая граната
down = лечь
left = выглянуть влево
right = выглянуть вправо
a = действие
b = прыжок, встать
x = присесть
y = граната
l1 = перезарядка
r1 = огонь, щелчок в меню
l2 = прицел
r2 = другое оружие
f1 = меню
f2 = удар прикладом, задержать дыхание
f3 = бинокль
f4 = задачи (держать)
