; Cold Fear (2005, Darkworks, Direct3D 9), GOG's edition 1.0 v3 (2025,
; Russian text and voices) under Wine for the GO Ultra
; (games/coldfear/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/coldfear/wine.ini.
name = Cold Fear
hint = L stick  walk    R stick  camera, aim    L1  aim    R1  fire    A  use    B (hold)  run, menu choice    X  reload    Y  climb\nL2/R2  weapon    F1  menu (exit)    F2  pause    F3  crouch    F4  aim view    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба    П. стик  камера, прицел    L1  прицел    R1  выстрел    A  действие    B (держать)  бег, выбор в меню    X  перезарядка    Y  уступ\nL2/R2  оружие    F1  меню (выход)    F2  пауза    F3  присесть    F4  вид прицела    F5  свернуть    F6 (держать)  выход
exe = ColdFear_retail.exe
; The game's mode 0 (res.bin) made 854x480 by prepare.sh: the screen's own
mode = 854x480
modes = 854x480
locale = ru_RU
; Saved games and the options (COLDFEAR.DAT) in SAVES; res.bin rewritten
; by the graphics options' Accept (unchecked: crashed on the card)
writable = saves, res.bin
; GOG's input layer (dinput8.dll, goginput.ini): it takes the pad by its
; VID/PID, the Xbox 360's (045E:028E) as bare_app_wine's pad is
dlls = dinput8=n,b
; What GOG's installer writes (goggame-1297439746.script)
reg = HKCU\SOFTWARE\Atari\ColdFear\Install Path=D:\coldfear\
; The deck at the start (shadows low, prepare.sh): the main thread waits
; ~35% of its time for wined3d's render thread (85% busy: emulated wined3d,
; Mesa). HeapMaps=1: 24.4 -> 32.3 fps. Tried, no gain: PAN_MMAP_WINDOW
; (33.0); BOX64_DYNAREC_SAFEFLAGS=0 sends the new game back to the main
; menu.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; The frame limit unless the game's options (Y on its tile) choose
; another: 30, held on the stormy deck (32-33 unlimited; the game's own
; limit is 120)
fps_limit = 30

[keys]
; The game plays by the gamepad, its own layout kept as NFSU's and The
; Bard's Tale's are (GOG's layer, defaults after the PS2's; the game's
; Settings > Controls > Keys, its second column, DEV0): the device's
; sticks and buttons are the pad's, each where an Xbox 360 pad has it,
; but A and B swapped (the user's choice): button 0 (B) runs while held
; and is the choice in every menu, 1 (A) uses, 2 (X) reloads, 3 (Y) grabs a ledge, 4 (L1) aims over the
; shoulder, 5 (R1) fires, 6/7 (the triggers, the Z axis) the previous and
; next weapon, 8 (Back) the menu of the mission, documents and Exit, 9
; (Start) pauses, 10/11 (the sticks' buttons, which the device has not)
; crouch and the third-person aim view. The D-pad moves in the menus
; (goginput.ini dpadtoanalog), held for 0.2 s at least. F1 is the game's
; menu as in every game (the one with Exit), F2 pause.
stick = pad
rstick = pad
dpad = pad
a = pad_b
b = pad_a
x = pad_x
y = pad_y
l1 = pad_lb
r1 = pad_rb
l2 = pad_lt
r2 = pad_rt
f1 = pad_back
f2 = pad_start
f3 = pad_ls
f4 = pad_rs

[labels]
stick = walk
rstick = camera, aim
up = menu up
down = menu down
left = menu left
right = menu right
a = use
b = run (hold), menu choice
x = reload
y = climb a ledge
l1 = aim
r1 = fire
l2 = previous weapon
r2 = next weapon
f1 = menu: mission, documents, exit
f2 = pause
f3 = crouch
f4 = third-person aim view

[labels.ru]
stick = ходьба
rstick = камера, прицел
up = меню вверх
down = меню вниз
left = меню влево
right = меню вправо
a = действие
b = бег (держать), выбор в меню
x = перезарядка
y = уступ
l1 = прицел
r1 = выстрел
l2 = прошлое оружие
r2 = следующее оружие
f1 = меню: задание, документы, выход
f2 = пауза
f3 = присесть
f4 = вид прицела от 3-го лица
