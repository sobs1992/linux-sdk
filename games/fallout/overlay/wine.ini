; Fallout (1997), the Russian "Fixed Edition" (sfall 1.8, the hi-res
; patch, FE's fixes and translation; FalloutFE of games/fallout/README.md)
; under Wine for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/fallout/wine.ini.
name = Fallout
hint = L stick  cursor    D-pad  slowly    R stick  scroll    A  click, skip a video    B  back (in the main menu: quit!)\nY  cursor mode (fight: aim, then A)    X  inventory    L1  other hand    R1  end turn    L2  map    R2  character\nF1  menu    F2  quick load    F3  quick save    F4  Pip-Boy
hint.ru = Л. стик  курсор    крестовина  медленно    П. стик  прокрутка    A  клик, пропуск ролика    B  назад (в главном меню — выход!)\nY  режим курсора (бой: прицел, затем A)    X  инвентарь    L1  другая рука    R1  конец хода    L2  карта    R2  персонаж\nF1  меню    F2  быстрая загрузка    F3  быстрая запись    F4  Пип-бой
exe = Falloutw.exe
; The device's own screen: the hi-res patch (f1_res.ini, set by
; games/fallout/prepare.sh) draws the game at 854x480, a pixel a pixel
mode = 854x480
modes = 854x480
locale = ru_RU
; What the game writes: saved games, and the maps, scripts and protos of
; the places visited (data\maps...: what a save takes along), settings
writable = data/savegame, data/maps, data/proto, data/scripts, fallout.cfg
; sfall: its ddraw.dll before Wine's
dlls = ddraw=n,b
; The videos: Interplay's MVE decoder writes each 8x8 block's code into
; the code itself and jumps there, in the same page. In big blocks Box64
; kept running the stale code (the videos fell apart into blocks); in one
; block a jump (BIGBLOCK=0) it saw every change but compiled the code
; again for each block, and the intro fell to ~4 fps, its music broken
; off. The decoder's code (0x4da000-0x4e0000) is interpreted instead, the rest
; compiled in big blocks: the videos at their own 15 fps, sound unbroken.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 BOX64_NODYNAREC=0x4da000-0x4e0000
; No frame limit by default: the game draws by DirectDraw a piece at a
; time (the cursor taken off and put back, each a frame to Wine): 45-60
; frames a second on the map, ~150 while the cursor moves. A limit of 30
; held each piece back, the game slowed down and the cursor flickered.
fps_limit = none
; Esc in the main menu quits at once: B, B over the videos closed the
; game. B and F1 do nothing for the first 30 s (A skips the videos)
esc_delay = 30

[keys]
; The mouse game of the PC with its keys; the map scrolls with the arrow
; keys. F2/F3 the quick load and save of sfall (F7/F6: the first F6 asks
; for a slot and a description, later ones save into it at once); the
; game's own save and load screens (F4/F5) are in its menu (F1)
stick = mouse
rstick = arrows
dpad = mouse
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = esc
x = i
y = rbutton
l1 = b
r1 = space
l2 = tab
r2 = c
f1 = esc
f2 = f7
f3 = f6
f4 = p

[labels]
stick = cursor
rstick = scroll the map
up = cursor, slowly
down = cursor, slowly
left = cursor, slowly
right = cursor, slowly
a = click, skip a video
b = back, menu (Esc; the main menu: quit)
y = cursor mode (right click; fight: to the target)
x = inventory
l1 = other hand
r1 = end turn
l2 = map
r2 = character
f1 = menu (save, load)
f2 = quick load
f3 = quick save (the first: a slot)
f4 = Pip-Boy

[labels.ru]
stick = курсор
rstick = прокрутка карты
up = курсор медленно
down = курсор медленно
left = курсор медленно
right = курсор медленно
a = клик, пропуск ролика
b = назад, меню (Esc; в главном меню — выход)
y = режим курсора (правый клик; бой: прицел)
x = инвентарь
l1 = другая рука
r1 = конец хода
l2 = карта
r2 = персонаж
f1 = меню (запись, загрузка)
f2 = быстрая загрузка
f3 = быстрая запись (в первый раз — слот)
f4 = Пип-бой
