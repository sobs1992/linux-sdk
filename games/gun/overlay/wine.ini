; GUN (2005, Neversoft, Direct3D 9), the Russian edition, under Wine for
; the GO Ultra (games/gun/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/gun/wine.ini.
name = GUN
hint = L stick  walk    R stick  camera, aim    R1  fire    L1  melee    A  action, mount    B  jump    X  crouch, gallop    Y  quick draw\nL2/R2  weapon    D-pad  zoom, reload, throw, holster    F1  menu    F2  flask    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба    П. стик  камера, прицел    R1  выстрел    L1  рукопашная    A  действие, конь    B  прыжок    X  присесть, галоп    Y  скоростная стрельба\nL2/R2  оружие    крестовина  прицел, перезарядка, бросок, убрать    F1  меню    F2  фляга    F5  свернуть    F6 (держать)  выход
exe = Gun.exe
; ThirteenAG's widescreen fix (prepare.sh puts its ASI loader in the
; game's directory as d3d9.dll) renders at the desktop's size
mode = 854x480
modes = 854x480
locale = ru_RU
dlls = d3d9=n,b
; The game holds 30 frames a second itself (its engine's pace)
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1

[keys]
; The game's keyboard and mouse (its manual's table), laid out as the
; other shooters: the left stick W A S D, the right stick the mouse that
; turns the camera and aims
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
dpad = arrows
up = z
down = r
left = v
right = t
a = f
b = space
x = shift
y = c
l1 = rbutton
r1 = lbutton
l2 = wheeldown
r2 = wheelup
f1 = esc
f2 = g
f3 = none
f4 = none

[labels]
stick = walk
rstick = camera, aim
up = scope (rifles)
down = reload
left = throw (hold: farther)
right = holster
a = action, talk, mount
b = jump
x = crouch, roll, gallop
y = quick draw
l1 = melee, rear the horse
r1 = draw and fire
l2 = previous weapon
r2 = next weapon
f1 = menu, map
f2 = whiskey flask

[labels.ru]
stick = ходьба
rstick = камера, прицел
up = прицел (ружья)
down = перезарядка
left = бросок (держать — дальше)
right = убрать оружие
a = действие, разговор, конь
b = прыжок
x = присесть, перекат, галоп
y = скоростная стрельба
l1 = рукопашная, конь на дыбы
r1 = выхватить и выстрелить
l2 = прошлое оружие
r2 = следующее оружие
f1 = меню, карта
f2 = фляга с виски
