; The Bard's Tale ARPG: Remastered and Resnarkled (2018 edition of the
; 2004 game, inXile; Direct3D 9, XInput, WMV videos), the GOG edition,
; under Wine for the GO Ultra (games/bardstale/README.md). bare_app_wine's
; settings (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/bardstale/wine.ini.
name = The Bard's Tale
hint = The gamepad as the game shows it (its own buttons: A choose, B back)\nF1  pause menu (Start)    F2  map (Back)    F5  minimise    F6 (hold)  quit
hint.ru = Геймпад, как его показывает игра (её кнопки: A выбор, B назад)\nF1  меню паузы (Start)    F2  карта (Back)    F5  свернуть    F6 (держать)  выход
exe = The Bard's Tale.exe
; The game picks 1024x768 itself, shown whole (640x480 with bars)
mode = 1024x768
locale = ru_RU
; The game's settings with "Use gamepad" on (settings.bin, byte 0xa4: the
; game's own default is off, and it then ignores the pad), copied to
; AppData\Local\inXile entertainment\The Bard's Tale on the first start
profile = profile
; As for the other Direct3D 9 games: Box64's big blocks, WineD3D's maps
; without the render thread and its GL state cache; the videos (WMV,
; DirectShow) play through GStreamer
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1
fps_limit = none
; Played by the gamepad alone: the Windows cursor, left shown over the
; world by the game, not drawn
cursor = hidden

[keys]
; All of it the game's own gamepad (XInput, an Xbox 360 pad's): its menus
; and its hints show the buttons
stick = pad
rstick = pad
dpad = pad
a = pad_a
b = pad_b
x = pad_x
y = pad_y
l1 = pad_lb
r1 = pad_rb
l2 = pad_lt
r2 = pad_rt
f1 = pad_start
f2 = pad_back
f3 = pad_ls
f4 = pad_rs

[labels]
stick = walk, menus
rstick = camera
a = choose, attack
b = back
f1 = pause menu
f2 = map

[labels.ru]
stick = ходьба, меню
rstick = камера
a = выбор, атака
b = назад
f1 = меню паузы
f2 = карта
