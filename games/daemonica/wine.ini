; Daemonica (2006, 3D GameStudio A6, Direct3D 9), Russian edition.
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/daemonica/wine.ini.
name = Daemonica
; The engine itself: Daemonica.exe is only a launcher that starts it so
hint = L stick  cursor    R stick  camera: turn, zoom    A  click    B  back (Esc)\nX  inventory    Y  block (hold)    L1  diary    R1  map    F2  quick save    F3  quick load    F4  help
hint.ru = Л. стик  курсор    П. стик  камера: поворот, зум    A  клик    B  назад (Esc)\nX  инвентарь    Y  блок (держать)    L1  дневник    R1  карта    F2  быстрая запись    F3  загрузка    F4  справка
exe = maindata.dae
args = -nc -nx 200 -d langrus
; The game's own mode (Data\daemonica.cfg video_mode: 7 = 800x600)
mode = 800x600
locale = ru_RU
; Saved games, settings and the log are written to Data
writable = Data
; Box64 and WineD3D as for Pirates!; WINE_FONT_SCALE=1.25 makes the text
; readable on the 854x480 screen (the dialogue layout of daemonica.wrs is
; patched for it, see games.manifest); FreeType hints like Windows.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1 WINE_FONT_SCALE=1.25 FREETYPE_PROPERTIES=truetype:interpreter-version=35

[keys]
; Daemonica is played with the mouse. Its camera turns with the Left and
; Right keys and zooms with Up, Down and the wheel; Esc closes the
; inventory, diary, map, help and otherwise opens the menu; I, D, M open
; the inventory, diary and map; Space held raises the sword to block;
; F5 and F8 save and load quickly, F1 is the help. Insert and End quit the
; game at once: no button sends them.
stick = mouse
; Turned as far as it is pushed, zoomed up and down
rstick = turn
; The D-pad turns and zooms too (the arrow keys)
dpad = arrows
; The game reads the keyboard by DirectInput: the cursor block's arrows
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = esc
x = i
y = space
l1 = d
r1 = m
; The right button only turns the diary's pages
l2 = rbutton
r2 = mbutton
select = i
start = esc
f1 = esc
f2 = f5
f3 = f8
f4 = f1
