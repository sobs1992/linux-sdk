; Neighbours from Hell 2: On Vacation (2004, JoWooD), Russian edition,
; under Wine for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/neighbours2/wine.ini.
name = Neighbours from Hell 2
hint = L stick  cursor    A  click    B  back (Esc)    Y  right click    R stick / D-pad  scroll\nX  Woody    R1  the neighbour    L2  his mother    L1  pause    F1  menu (Esc)    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор    A  клик    B  назад (Esc)    Y  правый клик    П. стик / крестовина  прокрутка\nX  Вуди    R1  сосед    L2  мама    L1  пауза    F1  меню (Esc)    F5  свернуть    F6 (держать)  выход
; The game itself (DirectDraw, 16-bit colour: the 16-bit display modes are
; the SDK's Wine patch 0015). It finds its data in
; ..\data from the current directory, which must be bin (the GOG wrapper
; starts it there too): start.exe waits for it there. D: is /games.
exe = C:\windows\system32\start.exe
args = /wait /d D:\neighbours2\bin game.exe
; The game knows only 800x600. Its interface is moved into the top 480
; rows (pictures cut, dialogs moved, the interface DLLs told the screen is
; 480 high: prepare.sh) and only those are shown, at 1:1 with the full
; width; the game still draws all 600 rows, the last 120 never seen.
mode = 800x600
rows = 480
locale = ru_RU
; Settings and saved games go to the prefix's Documents\JoWooD
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). A 2D game of slow
; animations: 30 is all it needs.
fps_limit = 30

[keys]
; Played with the mouse. The view scrolls with the arrow keys (and the
; mouse at the screen's edge); 3 centres Woody, 1 shows the neighbour,
; 2 his mother, P pauses, Esc opens the menu (data\shortcuts.xml).
stick = mouse
rstick = arrows
dpad = arrows
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = esc
x = 3
y = rbutton
l2 = 2
l1 = p
f1 = esc
select = tab
start = esc
r1 = 1

[labels]
stick = cursor
rstick = scroll
up = scroll
down = scroll
left = scroll
right = scroll
a = click
b = back, menu (Esc)
y = right click
x = Woody
r1 = the neighbour
l2 = his mother
l1 = pause
f1 = menu (Esc)

[labels.ru]
stick = курсор
rstick = прокрутка
up = прокрутка
down = прокрутка
left = прокрутка
right = прокрутка
a = клик
b = назад, меню (Esc)
y = правый клик
x = Вуди
r1 = сосед
l2 = мама
l1 = пауза
f1 = меню (Esc)
