; The Chronicles of Myrtana: Archolos (Steam, Russian text and voices), a
; game of its own on Gothic II 2.6, under Wine for the GO Ultra
; (games/gothic/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/archolos/wine.ini.
name = Archolos
hint = L stick  walk, turn, menus    R stick  sidestep, look, torch    A  action    B  weapon    X  Enter\nY  inventory    L1  parry    R1  jump    L2  sneak    R2  walk slowly    D-pad  1-4    F1  menu    F2  character    F3  log    F4  map
hint.ru = Л. стик  ходьба, поворот, меню    П. стик  шаг вбок, обзор, факел    A  действие    B  оружие    X  Enter\nY  инвентарь    L1  блок    R1  прыжок    L2  красться    R2  шагом    крестовина  1-4    F1  меню    F2  персонаж    F3  дневник    F4  карта
exe = system/Gothic2.exe
; Steam starts it so: the mod's own ini in system/
args = -game:TheChroniclesOfMyrtana.ini
; 16:9 with 600 rows, shown at 854x480: the game's video menu lists only
; modes of 600 rows and more and writes back one it does not list (854x480
; became 800x600 16-bit after the first saved game loaded)
mode = 1066x600
locale = ru_RU
; Gothic.ini (settings), the saved games and MSSSOFT.M3D, the copy of
; Miles/MssSoft.m3d the game makes on each start (on read-only /games the
; copy fails: "could not copy file ... into the system directory"); the
; rest stays on /games
writable = system/Gothic.ini system/MSSSOFT.M3D Saves_TheChroniclesOfMyrtana
; PAN_MMAP_WINDOW (SDK's Mesa patch) maps the GPU's buffers below 4 GiB and
; WINE_WOW64_GL_BUFFER_STORAGE=1 (SDK's Wine patch) lets WineD3D keep them
; mapped (see games/gothic2/overlay/wine.ini). GLStateCache=1: no GL calls
; that change nothing. G2FAST=0 would turn off g2fast (BugslayerUtil.dll):
; its world has 15919 waypoints, and the engine looked for the nearest one
; by walking them all, ~120 times a second (a quarter of the main thread).
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 PAN_MMAP_WINDOW=80000000-100000000 WINE_WOW64_GL_BUFFER_STORAGE=1 WINE_D3D_CONFIG=GLStateCache=1

[keys]
; The keys of Gothic.ini's [KEYS] (the player's from Steam, the arrows
; added to the turns by prepare.sh): DirectInput, so the cursor block's
; arrows. The left stick walks and turns (Up/Down/Left/Right) and moves
; through menus, dialogue choices and the inventory.
stick = arrows
arrows = cursor
dpad = arrows
; the right stick: sidesteps (Q, E), looks around (R), the torch (T,
; Archolos' own key)
rstick = arrows
rstick_left = q
rstick_right = e
rstick_up = r
rstick_down = t
; the quick slots 1-4 (weapons, spells)
up = 1
down = 2
left = 3
right = 4
; action (attack, talk, take, use, choose a reply) is Space, the weapon
; Ctrl; menus want Enter, which in play does nothing
a = space
b = ctrl
x = enter
y = tab
l1 = end
r1 = alt
l2 = x
r2 = shift
f1 = esc
f2 = b
f3 = n
f4 = m

[labels]
stick = walk, turn, menus
rstick = sidestep, look, torch
up = slot 1
down = slot 2
left = slot 3
right = slot 4
a = action
b = weapon
x = Enter (menus)
y = inventory
l1 = parry
r1 = jump
l2 = sneak
r2 = walk slowly
f1 = menu
f2 = character
f3 = log
f4 = map

