; Knights of the Temple: Infernal Crusade (2004, Starbreeze, Direct3D 8)
; under Wine for the GO Ultra, 1C's Russian edition ("Тамплиеры: Крестовый
; поход", games/templar/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/templar/wine.ini.
name = Knights of the Temple
hint = L stick  walk, menus    D-pad  weapon    R stick  camera\nR1  attack    L1  block    A  use (Enter)    Y  strong attack    X/B  target left/right\nL2  combo    R2  divine power    F1  pause    F2  status    F3  no target    a new player: A
hint.ru = Л. стик  ходьба и меню    крестовина  оружие    П. стик  камера\nR1  удар    L1  блок    A  действие (Enter)    Y  сильный удар    X/B  цель слева/справа\nL2  комбо    R2  сила    F1  пауза    F2  статус    F3  без цели    новый игрок: A
exe = Templar.exe
; The game's own mode (Environment.cfg: vid_mode 640 480), 4:3 between
; black bars. Its OpenGL renderer (RndrGL.dll, VID_RENDER=OpenGL) wants
; NVIDIA's extensions and crashes: Environment.cfg keeps Direct3D8.
mode = 640x480
locale = ru_RU
; Settings in the game's directory, profiles and saved games in
; Sbz1\SAVE\<profile> (written at the first checkpoint)
writable = Environment.cfg Options.cfg Sbz1/Save Sbz1/User.cfg
; In play the game shows its picture as it draws it (an identity gamma
; ramp; only its menus and videos get a brighter one, its brightness
; setting greyed): the dungeons were black on the small screen.
gamma = 1.6
; PAN_MMAP_WINDOW (SDK's Mesa patch 0005): the GPU's buffers mapped below
; 4 GiB, where Wine hands a mapping to the 32-bit game as it is. Above
; that, each map of the game's 2 MiB vertex and 1 MiB index buffers (~94
; a frame, the rest of the buffer each time, for a few KiB) was a copy and
; a copy back, ~280 MB a frame: 6 fps in the first cell, now 58-60 (the
; screen's rate; the menu 65 -> 210). 0x80000000 and up: above the 2 GiB
; of a program without /LARGEADDRESSAWARE, which Templar.exe is.
; Not HeapMaps: it uploads each map's whole range, as large.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 PAN_MMAP_WINDOW=80000000-100000000
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 58-60 fps in play: the
; screen's 60.
fps_limit = 60

[keys]
; The keys of the PC version (Readme.txt), laid out as its console
; versions' pad: the left stick walks and moves through the menus, the
; D-pad picks the weapon (the game's own "presspad"), the right stick
; turns the free camera.
stick = arrows
dpad = arrows
; DirectInput keys: the cursor block's, not the keypad's
arrows = cursor
rstick = arrows
rstick_up = home
rstick_down = end
rstick_left = delete
rstick_right = pgdn
; sword, axe, mace, bow
up = 1
left = 2
right = 3
down = 4
; As the SDK's shooters (DOOM 3's layout): R1 attack (Q), L1 block (E),
; A use (R) with Enter for the menus and "press Enter" (Enter does nothing
; in play; a profile's name gets an R from it); the targets on X and B,
; at the face buttons' left and right; Y the strong attack (W)
a = enter+r
x = a
b = s
y = w
l1 = e
r1 = q
; combo attacks (Tab), divine powers (Space), held with the attacks
l2 = tab
r2 = space
; pause and the game's menu (Esc), status (F1), no target (X)
f1 = esc
f2 = f1
f3 = x
; the game has no key of its own for the mission's goals (its pause
; menu shows them): nothing, not wine.ini's F4
f4 = none

