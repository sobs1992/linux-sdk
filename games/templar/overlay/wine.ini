rstick = camera
up = sword
left = axe
right = mace
down = bow
a = use, Enter
r1 = attack
l1 = block
y = strong attack
x = target to the left
b = target to the right
l2 = combo attack
r2 = divine power
f1 = pause, menu
f2 = status
f3 = no target

