; Need for Speed: Most Wanted (2005, EA Black Box, Direct3D 9) 1.3, the
; Russian edition with ThirteenAG's widescreen fix and the Extra Options,
; under Wine for the GO Ultra (games/nfsmw/README.md). bare_app_wine's
; settings (apps/bare_app/ports/wine/wine.ini explains every key); goes
; to /games/nfsmw/wine.ini.
name = Need for Speed: Most Wanted
hint = L stick  steer    A, R1  gas, choose    B, L1  brake, reverse, back    L2  handbrake    R2  look back    X  nitrous    Y  speedbreaker\nD-pad  map, blacklist, SMS, events    F1  pause    F4  reset the car    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  руль    A, R1  газ, выбор    B, L1  тормоз, задний ход, назад    L2  ручник    R2  взгляд назад    X  закись азота    Y  замедление времени\nкрестовина  карта, чёрный список, SMS, гонки    F1  пауза    F4  восстановить машину    F5  свернуть    F6 (держать)  выход
exe = speed.exe
; The widescreen fix renders at the desktop's size, fixes the HUD and the
; field of view
mode = 854x480
modes = 854x480
locale = ru_RU
; The profile and Settings.ini (the widescreen fix's
; CustomUserFilesDirectoryInGameDir, WriteSettingsToFile)
writable = SAVES
; The ASI loader of the widescreen fix and the Extra Options
dlls = dinput8=n,b
; In a race the game's and WineD3D's threads take 60-75 % each: 30-35 fps
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; An even 30 in a race (30-35 unlimited, the menus 130-150)
fps_limit = 30

[keys]
; The game plays by the gamepad (XInput, Xbox icons by the widescreen
; fix's ImproveGamepadSupport), its own layout with two changes in the
; profile player (overlay/SAVES), as NFSU's: brake on B (Button 1, also
; back in the menus), handbrake on X. A and R1 are gas, B and L1 brake, L2
; the handbrake, R2 looks back (the game's LB), X nitrous (its Back), Y
; the speedbreaker, F4 resets the car (its RB), F1 pauses (Start); the
; D-pad picks events, the blacklist, the map and the SMS
stick = pad
rstick = mouse
dpad = pad
a = pad_a
b = pad_b
x = pad_back
y = pad_y
l1 = pad_b
r1 = pad_a
l2 = pad_x
r2 = pad_lb
f1 = pad_start
f2 = none
f3 = none
f4 = pad_rb

[labels]
stick = steer, menus
rstick = mouse
up = events, blacklist, map, SMS
down = events, blacklist, map, SMS
left = events, blacklist, map, SMS
right = events, blacklist, map, SMS
a = gas, choose
b = brake, reverse, back
x = nitrous
y = speedbreaker
l1 = brake, reverse
r1 = gas
l2 = handbrake
r2 = look back
f1 = pause
f4 = reset the car

[labels.ru]
stick = руль, меню
rstick = мышь
up = гонки, чёрный список, карта, SMS
down = гонки, чёрный список, карта, SMS
left = гонки, чёрный список, карта, SMS
right = гонки, чёрный список, карта, SMS
a = газ, выбор
b = тормоз, задний ход, назад
x = закись азота
y = замедление времени
l1 = тормоз, задний ход
r1 = газ
l2 = ручник
r2 = взгляд назад
f1 = пауза
f4 = восстановить машину
