; Serious Sam: The First Encounter (the First Encounter, the Russian edition patched to 1.05), by Serious Engine 1.10
; (package serious-engine, bare-app.SERIOUSSAM=y), an SDL2 game: OpenGL
; drawn by the GPU through SDL's bareapp driver, the gamepad as an SDL
; joystick. Game files: the .gro files and the rest of a bought copy in
; this directory (SE1_DATA_DIR, read only); settings, players and saved
; games in the game's data directory (SDL's pref path under XDG_DATA_HOME).
; The GO Advance's (games/oga.manifest: overlay-oga): one stick, which looks;
; the D-pad walks. On the games card with the game, so the
; menu entry comes and goes with the game; the engine is in the image.
name = Serious Sam: The First Encounter
exe = /usr/bin/serioussam
needs = 1_00c.gro
; cover.png (here) is made by scripts/games-image.py
; Controls: Controls/00-Default.ctl as games/serioussam/controls.py wrote
; it (a new player's controls; changed in the game's Controls menu), as
; the GO Ultra's (DOOM 3's) but the stick looks and the D-pad walks. The
; engine reads triggers only as axes: L2 and R2 are buttons paddle3 and
; paddle2 here, F4 the button Back (NETRICSA). F1 Escape (the menu), F2
; quick load (F9), F3 quick save (F6). In the menus: D-pad or left stick,
; A, B back (the engine's patch)
gamepad = f1=none, f2=none, f3=none, f4=back, l2=paddle3, r2=paddle2
keys = f1=escape, f2=f9, f3=f6
hint = Stick  look    D-pad  walk    R1  fire    A  use    L1  reload    L2/R2  weapon    B  jump    X  crouch    Y  flip weapon\nF1  menu    F2  quick load    F3  quick save    F4  NETRICSA    F5  minimise    F6 (hold)  quit
hint.ru = Стик  обзор    крестовина  ходьба    R1  огонь    A  действие    L1  перезарядка    L2/R2  оружие    B  прыжок    X  присесть    Y  смена ствола\nF1  меню    F2  загрузка    F3  сохранение    F4  ИНЕРТАН    F5  свернуть    F6 (держать)  выйти
scale = fit
; 30 fps: the A35 cores and the Mali-G31 hold it more evenly
fps_limit = 30

[env]
; reading the GPU's picture back from a linear (not tiled) buffer: as RTCW
; on the GO Advance, the A35 untiling it was most of a core
PAN_MESA_DEBUG = linear
SE1_DATA_DIR = {dir}
SE1_SCREEN_WIDTH = {width}
SE1_SCREEN_HEIGHT = {height}

[labels]
; what each control does, in bare_app's controls screen (controls.py)
stick = look, menus
up = forward
down = back
left = step left
right = step right
a = use, choose
b = jump, back
x = crouch
y = flip weapon
l1 = reload
r1 = fire
l2 = previous weapon
r2 = next weapon
f1 = menu
f2 = quick load
f3 = quick save
f4 = NETRICSA

[labels.ru]
stick = обзор, меню
up = вперёд
down = назад
left = шаг влево
right = шаг вправо
a = действие, выбор
b = прыжок, назад
x = присесть
y = смена ствола
l1 = перезарядка
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
f1 = меню
f2 = быстрая загрузка
f3 = быстрое сохранение
f4 = ИНЕРТАН
