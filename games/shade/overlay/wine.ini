; Shade: Wrath of Angels (2004, Black Element), 1C's Russian edition
; ("Гнев ангелов", 1.2) under Wine for the GO Ultra (games/shade/README.md).
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/shade/wine.ini.
name = Shade: Wrath of Angels
hint = L stick  walk, run (tilt)    R stick  camera    A  attack    B  jump    X  use    Y  crouch    L1  demon    R1  block    L2  first person\nD-pad  fist, sword, pistol, crossbow    F1  menu    F2  inventory    F3  holster    F4  claw
hint.ru = Л. стик  шаг, бег, спринт (наклон)    П. стик  камера    A  атака    B  прыжок    X  действие    Y  пригнуться    L1  демон    R1  защита    L2  от первого лица\nкрестовина  кулак, меч, пистолет, арбалет    F1  меню    F2  инвентарь    F3  убрать оружие    F4  лапа
exe = SHADE.EXE
mode = 854x480
modes = 854x480
locale = ru_RU
; settings.cfg (the engine's settings and keys), saved games
writable = save, settings.cfg
; The mouse as moves: the engine reads it by DirectInput
mouse = relative
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 60-70 fps in the first
; levels, 90+ in the menus: the screen's 60.
fps_limit = 60

[keys]
; The left stick is a gamepad's (Wine's winebus patch 0026), with the
; engine's joypad on (Joypad 1 in settings.cfg, games/shade/prepare.sh):
; the tilt is the pace, as the game's scripts set it (player.h DoControl,
; of 1000: under 200 still, walk to 700, run to 900, sprint beyond). The
; pad's right stick and triggers stay at rest, the camera is the mouse.
; The rest the PC's keys (Readme.txt, "Управление в игре"): the mouse
; turns the camera, left button attack, right button block, the wheel
; faster and slower (the pace of W A S D only: not needed), left Shift
; the first person view while held (L2), 1-5 the weapons
stick = pad
rstick = mouse
cursor_speed = 2.4
a = lbutton
b = space
x = e
y = c
l1 = r
r1 = rbutton
l2 = lshift
r2 = none
up = 1
right = 2
down = 3
left = 4
f1 = esc
f2 = q
f3 = v
f4 = 5

[labels]
stick = walk, run, sprint (the tilt)
rstick = camera
a = attack
b = jump
x = use
y = crouch
l1 = demon
r1 = block
l2 = first person view
up = fist, fireball
right = sword, fire swarm
down = pistol, fire wall
left = crossbow, immortality
f1 = menu
f2 = inventory
f3 = holster
f4 = claw, death skull

[labels.ru]
stick = шаг, бег, спринт (наклон)
rstick = камера
a = атака
b = прыжок
x = действие
y = пригнуться
l1 = демон
r1 = защита
l2 = вид от первого лица
up = кулак, огненный шар
right = меч, огненный рой
down = пистолет, огненная стена
left = арбалет, бессмертие
f1 = меню
f2 = инвентарь
f3 = убрать оружие
f4 = лапа, череп смерти
