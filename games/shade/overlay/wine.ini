; Shade: Wrath of Angels (2004, Black Element), 1C's Russian edition
; ("Гнев ангелов", 1.2) under Wine for the GO Ultra (games/shade/README.md).
; bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini explains
; every key); goes to /games/shade/wine.ini.
name = Shade: Wrath of Angels
hint = L stick  walk    R stick  camera    R1 / A  attack    L1  block    B  jump    X  use    Y  demon\nL2/R2  slower/faster    D-pad  weapons    F1  menu    F2  crouch    F3  claw    F4  inventory\nVideos: A    F1 in the main menu quits the game
hint.ru = Л. стик  ходьба    П. стик  камера    R1 / A  атака    L1  защита    B  прыжок    X  действие    Y  демон\nL2/R2  медленнее/быстрее    крестовина  оружие    F1  меню    F2  пригнуться    F3  лапа    F4  инвентарь\nролики: A    F1 в главном меню — выход из игры
exe = SHADE.EXE
mode = 854x480
modes = 854x480
locale = ru_RU
; settings.cfg (the engine's settings and keys), saved games
writable = save, settings.cfg
; The mouse as moves: the engine reads it by DirectInput
mouse = relative
; Esc (B, F1) in the main menu quits at once: F1 pressed over the videos
; closed the game. Nothing for the first 30 s (A skips the videos)
esc_delay = 30
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 60-70 fps in the first
; levels, 90+ in the menus: the screen's 60.
fps_limit = 60

[keys]
; The PC's keys (Readme.txt, "Управление в игре"): W A S D walk, the mouse
; turns the camera, left button attack, right button block, the wheel
; faster and slower (the pace: walk, run, sprint), 1-5 the weapons. The
; engine's joypad (the pace by the stick's tilt) is left off: the user
; chose the keys
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
; The camera turns 0.1 degree a mouse count (MouseSpeedH 70, player.h):
; 6 screen widths a second (x 0.3 for the right stick, 1537 counts) turn
; it round in 2.4 s at full tilt, about 150 degrees a second (2.4 took 6 s)
cursor_speed = 6.0
a = lbutton
b = space
x = e
y = r
l1 = rbutton
r1 = lbutton
l2 = wheeldown
r2 = wheelup
up = 1
right = 2
down = 3
left = 4
f1 = esc
f2 = c
f3 = 5
f4 = q

[labels]
stick = walk
rstick = camera, menu pointer
up = fist, fireball
down = pistol, fire wall
left = crossbow, immortality
right = sword, fire swarm
a = attack, menu choice
r1 = attack
l1 = block
b = jump
x = use
y = demon
l2 = slower
r2 = faster
f1 = menu
f2 = crouch
f3 = claw, death skull
f4 = inventory

[labels.ru]
stick = ходьба
rstick = камера, указатель меню
up = кулак, огненный шар
down = пистолет, стена огня
left = арбалет, бессмертие
right = меч, огненный рой
a = атака, выбор в меню
r1 = атака
l1 = защита
b = прыжок
x = действие
y = демон
l2 = медленнее
r2 = быстрее
f1 = меню
f2 = пригнуться
f3 = лапа, череп смерти
f4 = инвентарь
