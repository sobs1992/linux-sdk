; The Book of Unwritten Tales (2009, KING Art, Ogre 3D, Direct3D 9), the
; Russian edition of 1C-SoftClub, under Wine for the GO Ultra
; (games/bout/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/bout/wine.ini.
name = The Book of Unwritten Tales
; The inventory opens with the cursor at the screen's bottom edge (not by
; the right click in this edition); an item is taken by a click, used by a
; click on its target, put back by the right click
hint = L stick  cursor, at the bottom: inventory    R stick, D-pad  cursor, slower    A  click, take an item, choose or skip a line    Y  right click, put the item back\nX, R1 (hold)  hotspots    F1  menu (save: Save, an empty line, Save)    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор, внизу — инвентарь    П. стик, крестовина  курсор медленнее    A  клик, взять предмет, выбор и пропуск реплики    Y  правый клик, вернуть предмет\nX, R1 (держать)  активные точки    F1  меню (запись: Сохранение, пустая строка, Сохранение)    F5  свернуть    F6 (держать)  выход
exe = bout.exe
; Ogre's display mode (ogre.cfg in My Documents\Book of Unwritten Tales),
; the game's own choice on the first start: the screen's own 854x480, one
; pixel a pixel (sharper text than 1024x576 taken down). The game sizes its
; text by the screen's height, so the mode does not make it bigger:
; textsize.py patches bout.exe for that (games/bout/README.md). The game
; draws its scenes 16:10 inside, narrow bars at the sides. 1024x576 stays
; in the list for an ogre.cfg made before.
mode = 854x480
modes = 1024x576
locale = ru_RU
; What the 1C installer writes, as strings (its InstallFlag DWORDs are
; not needed: the game starts without them)
reg = HKLM\Software\KINGArt\UnwrittenTales\BuotInstallPath=D:\bout
reg = HKLM\Software\1C\{C1859202-3749-40C0-BEFD-3A2009D6618D}\AppFile=D:\bout\bout.exe
reg = HKLM\Software\1C\{C1859202-3749-40C0-BEFD-3A2009D6618D}\AppVersion=1.0.2.0
; Settings (config.xml, ogre.cfg), saved games and logs go to My
; Documents\Book of Unwritten Tales: nothing written into the game's
; directory.
; VideoMemorySize=2048 (WineD3D's own key): WineD3D takes the GPU for a
; GeForce 6800 with 128 MB; Ogre keeps every texture of a chapter and the
; loading of chapter 1 stopped with "Out of video memory" at 128 and at
; 1024 (the prologue then hung). Only the count: the textures are in the
; device's memory either way (the game ~650 MB, ~800 MB left).
; WINE_D3D9_MANAGED_EVICT=1 (wine-wow64 patch 0033): d3d9 keeps no copy of
; the managed textures in system memory once they are on the GPU. Without
; it the game held ~0.66 MB of RAM for each MB of textures (900 MB of RAM
; next to 680 MB on the GPU) and a heavier load ended in the OOM killer;
; with it 551 MB instead of 781 MB at 400 MB of textures, fps unchanged.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D9_MANAGED_EVICT=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1,VideoMemorySize=2048
; The frame limit unless the game's options (Y on its tile) choose
; another: 30, held steadily in the scenes and videos (quality high)
fps_limit = 30
; The game draws its own cursor. With the pointer in the screen's top row
; or left column it shows the Windows cursor (ShowCursor), and while it
; moves there the Windows arrow came and went over the game's: not drawn
cursor = hidden

[keys]
; The cursor on every stick and the D-pad: the left stick at full speed,
; the right one and the D-pad slower, for a small hotspot (wine.ini: the
; right stick 0.3 of it, the D-pad a steady 0.25)
stick = mouse
rstick = mouse
dpad = mouse
cursor_speed = 1.2
a = lbutton
y = rbutton
; Space held: the game marks every hotspot of the scene; R1 the same, for
; holding it while the thumb is on the right stick
x = space
r1 = space
; The menu is F1 alone: B (Esc) took the player out of the scene into the
; menu by a slip of the thumb next to A and Y
b = none
f1 = esc
; Not used by the game (no quick save; the wheel does nothing, also in
; the inventory): nothing, rather than wine.ini's defaults
l1 = none
l2 = none
r2 = none
f2 = none
f3 = none
f4 = none

[labels]
stick = cursor (bottom edge: inventory)
rstick = cursor, slower
up = cursor, slower
down = cursor, slower
left = cursor, slower
right = cursor, slower
a = click, take, choose or skip a line
y = right click, put the item back
x = hotspots (hold)
r1 = hotspots (hold)
f1 = menu (save: Save, an empty line, Save)

[labels.ru]
stick = курсор (нижний край — инвентарь)
rstick = курсор, медленнее
up = курсор, медленнее
down = курсор, медленнее
left = курсор, медленнее
right = курсор, медленнее
a = клик, взять, выбор и пропуск реплики
y = правый клик, вернуть предмет
x = активные точки (держать)
r1 = активные точки (держать)
f1 = меню (запись: Сохранение, пустая строка, Сохранение)
