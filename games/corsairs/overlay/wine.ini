; Pirates of the Caribbean ("Корсары: Пираты Карибского моря", 2003,
; Akella, Storm engine, Direct3D 8), the fan-patched Russian edition, under
; Wine for the GO Ultra (games/corsairs/README.md). bare_app_wine's
; settings (apps/bare_app/ports/wine/wine.ini explains every key); goes
; to /games/corsairs/wine.ini.
name = Корсары: Пираты Карибского моря
hint = L stick  walk, sail    R stick  camera, cursor    R1  strike, fire    A  act    B  back    X  commands    Y  camera view\nL1  block, telescope    L2  run    R2  pistol    F1  main menu    F2  sword    F3  time faster    F4  character, items
hint.ru = Л. стик  ходьба, паруса    П. стик  камера, курсор    R1  удар, залп    A  действие    B  назад    X  команды    Y  вид камеры\nL1  блок, подзорная труба    L2  бег    R2  пистолет    F1  главное меню    F2  сабля    F3  ускорить время    F4  персонаж, предметы
exe = ENGINE.exe
; The game's engine.ini: 800x600 in a window (full_screen = 0), the whole
; Windows desktop here, shown whole (640x480 with bars at the sides): its
; interface is laid out for 800x600
mode = 800x600
locale = ru_RU
; The game reads the mouse by DirectInput: moves, not places (as Prince
; of Persia)
mouse = relative
; It writes its saved games, settings (options) and logs into its
; directory
writable = SAVE options system.log compile.log
; As for Pirates!: Box64's big blocks, WineD3D's maps without the render
; thread and its GL state cache. Its videos (WMV, DirectShow's
; AMMultiMediaStream) play through GStreamer.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1
; The frame limit unless the game's options (Y on its tile) choose
; another: none, the game holds ~50 fps in the port (its main thread a
; whole core, WineD3D's half of one), with the full sea as with the fix
fps_limit = none

[keys]
; The controls as games/corsairs/prepare.sh sets them in the game's
; options: the left stick W A S D (walking on land and in a fight, the
; sails and the helm at sea and on the world map), the right stick the
; mouse (the camera; the cursor in the game's screens), the D-pad the
; arrows (dialogue lines, the commands' choice)
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
dpad = arrows
arrows = cursor
cursor_speed = 1.2
; A both lights a button of a screen (Space) and presses it (Enter), and
; turns a dialogue's page (Space), where Enter does nothing
a = space+enter
; Esc: back in the game's screens, its main menu in the game (as its F1)
b = esc
x = enter
y = tab
l1 = ctrl
r1 = space
l2 = shift
r2 = q
; As the SDK's shooters (DOOM 3's layout): R1 strike and fire (Space, as
; A), L1 block; F1 the game's main menu (its own F1, as in every game of
; the SDK); F4 the game's F2, the menu of its screens (character, ship,
; hold, passengers, journal, trade book, nations, items). The screens are
; gone through by the D-pad, A lights a button and X presses it: no
; mouse click needed; A does both
f1 = f1
f2 = e
f3 = r
f4 = f2

