; Need for Speed: Underground (2003, EA Black Box), 1.4 with ThirteenAG's
; widescreen fix and the Russian translation (games/nfsu/README.md), under
; Wine for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/nfsu/wine.ini.
name = Need for Speed: Underground
hint = L stick  steer    R stick  menu pointer    R2 / B  gas    L2 / A  brake, reverse    X  nitrous    R1  handbrake    L1  look back    Y  camera\nD-pad, A, B  menus    F1  pause    F2/F3  gear up/down    F4  reset the car
hint.ru = Л. стик  руль    П. стик  указатель в меню    R2 / B  газ    L2 / A  тормоз, задний ход    X  закись азота    R1  ручник    L1  задний вид    Y  камера\nкрестовина, A, B  меню    F1  пауза    F2/F3  передача вверх/вниз    F4  вернуть машину
exe = Speed.exe
; The widescreen fix renders at the desktop's size: the screen's own
mode = 854x480
modes = 854x480
locale = ru_RU
; The profiles and saved games (save/NFS Underground, by the widescreen
; fix's CustomUserFilesDirectoryInGameDir: games/nfsu/prepare.sh), a
; profile "player" there to start with: the console cannot type a name
writable = save
; The ASI loader (the game's dinput8.dll) loads the widescreen fix
dlls = dinput8=n,b
; What the installer writes; Language: the voices and subtitles of the
; Russian edition's files ("English" in its words)
reg = HKLM\Software\EA Games\Need For Speed Underground\Install Dir=D:\nfsu\
reg = HKLM\Software\EA Games\Need For Speed Underground\Language=English
; The race's music, engines and crashes add up far over full scale: the mix
; 6 dB down before DirectSound's limiter (Wine patch 0031), which then
; seldom has to act. The volume of the console makes up for it
reg = HKCU\Software\Wine\AppDefaults\Speed.exe\DirectSound\MixGain=-6
; As for Pirates!: Box64's big blocks, WineD3D's maps without the render
; thread, the fast mutexes. ~43 fps in a race, 60 in the menus.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 40-50 fps in a race, coming
; and going: 30 is even, and both busy threads drop from ~100% of a core
; to 76% and 65%.
fps_limit = 30

[keys]
; The left stick is the gamepad's (bare_app_wine's pad, Wine's winebus
; patch): analog steering on its X axis. The buttons are the pad's, laid
; out for the game's own joystick setup (Settings > Controls > Joystick,
; its defaults): Button 0 brake and reverse, 1 gas, 2 look back, 3
; camera, 4 nitrous, 5 handbrake, 6/7 gear down/up, 8 reset the car. The
; menus take Button 0 (A) as Enter and 1 (B) as back, but neither the
; pad's D-pad nor its stick: the D-pad is the keyboard's arrows there (and
; steers in a race, as the keyboard does). The right stick is the mouse:
; the menus' pointer, the item under it lit, A takes it (the game has no
; use for the mouse in a race)
stick = pad
rstick = mouse
dpad = arrows
arrows = cursor
; The pointer across the screen in about a second and a half
cursor_speed = 2.4
a = pad_a
b = pad_b
r2 = pad_b
l2 = pad_a
x = pad_lb
y = pad_y
l1 = pad_x
r1 = pad_rb
f1 = esc
f2 = pad_start
f3 = pad_back
f4 = pad_ls

[labels]
stick = steering
rstick = menu pointer
a = brake, menu choice
b = gas, back
r2 = gas
l2 = brake, reverse
x = nitrous
y = camera
l1 = look back
r1 = handbrake
f1 = pause
f2 = gear up
f3 = gear down
f4 = reset the car

[labels.ru]
stick = руль
rstick = указатель в меню
a = тормоз, выбор в меню
b = газ, назад
r2 = газ
l2 = тормоз, задний ход
x = закись азота
y = камера
l1 = задний вид
r1 = ручник
f1 = пауза
f2 = передача вверх
f3 = передача вниз
f4 = вернуть машину
