; Serious Sam: The Second Encounter (the Second Encounter, the Russian edition patched to 1.07), by Serious Engine 1.10
; (package serious-engine, bare-app.SERIOUSSAM=y), an SDL2 game: OpenGL
; drawn by the GPU through SDL's bareapp driver, the gamepad as an SDL
; joystick. Game files: the .gro files and the rest of a bought copy in
; this directory (SE1_DATA_DIR, read only); settings, players and saved
; games in the game's data directory (SDL's pref path under XDG_DATA_HOME).
; On the games card with the game (games/games.manifest: overlay), so the
; menu entry comes and goes with the game; the engine is in the image.
name = Serious Sam: The Second Encounter
exe = /usr/bin/serioussamse
needs = SE1_00.gro
; cover.png (here) is made by scripts/games-image.py
; Controls: Controls/00-Default.ctl as games/serioussam/controls.py wrote
; it (a new player's controls; changed in the game's Controls menu), as
; DOOM 3's on the GO Ultra. The engine reads triggers only as axes: L2 and
; R2 are buttons paddle3 and paddle2 here, F4 the button Back (NETRICSA, as
; DOOM 3's PDA). F1 Escape (the menu), F2 quick load (F9), F3 quick save
; (F6). In the menus: D-pad or left stick, A, B back (the engine's patch)
gamepad = f1=none, f2=none, f3=none, f4=back, l2=paddle3, r2=paddle2
keys = f1=escape, f2=f9, f3=f6
hint = R1  fire    A  use    L1  reload    L2/R2  weapon    B  jump    X  crouch    Y  serious bomb    D-pad  walk\nF1  menu    F2  quick load (menu: the quick saves)    F3  quick save    F4  NETRICSA (open, close)    F5  minimise    F6 (hold)  quit
hint.ru = R1  огонь    A  действие    L1  перезарядка    L2/R2  оружие    B  прыжок    X  присесть    Y  серьёзная бомба    крестовина  ходьба\nF1  меню    F2  загрузка (в меню — быстрые сохранения)    F3  сохранение    F4  ИНЕРТАН (открыть, закрыть)    F5  свернуть    F6 (держать)  выйти
scale = fit
; 60 fps (the engine's own vsync holds it there too)
fps_limit = 60

[env]
SE1_DATA_DIR = {dir}
SE1_SCREEN_WIDTH = {width}
SE1_SCREEN_HEIGHT = {height}

[labels]
; what each control does, in bare_app's controls screen (controls.py)
stick = walk, menus
rstick = look
a = use, choose
b = jump, back
x = crouch
y = serious bomb
l1 = reload
r1 = fire
l2 = previous weapon
r2 = next weapon
up = forward
down = back
left = step left
right = step right
f1 = menu
f2 = quick load (menu: the quick saves)
f3 = quick save
f4 = NETRICSA (open, close)

[labels.ru]
stick = ходьба, меню
rstick = обзор
a = действие, выбор
b = прыжок, назад
x = присесть
y = серьёзная бомба
l1 = перезарядка
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = вперёд
down = назад
left = шаг влево
right = шаг вправо
f1 = меню
f2 = быстрая загрузка (в меню — список)
f3 = быстрое сохранение
f4 = ИНЕРТАН (открыть, закрыть)
