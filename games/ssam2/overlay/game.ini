; Serious Sam: The Second Encounter (the Second Encounter, the Russian edition patched to 1.07), by Serious Engine 1.10
; (package serious-engine, bare-app.SERIOUSSAM=y), an SDL2 game: OpenGL
; drawn by the GPU through SDL's bareapp driver, the gamepad as an SDL
; joystick. Game files: the .gro files and the rest of a bought copy in
; this directory (SE1_DATA_DIR, read only); settings, players and saved
; games in the game's data directory (SDL's pref path under XDG_DATA_HOME).
; On the games card with the game (games/games.manifest: overlay), so the
; menu entry comes and goes with the game; the engine is in the image.
name = Serious Sam: The Second Encounter
exe = /usr/bin/serioussamse
needs = SE1_00.gro
; cover.png (here) is made by scripts/games-image.py
; Controls: Controls/00-Default.ctl as games/serioussam/controls.py wrote
; it (a new player's controls; changed in the game's Controls menu). The
; engine reads triggers only as axes: L2 and R2 are buttons paddle3 and
; paddle2 here. F1 Escape (the menu), F2 quick load (F9), F3 quick save
; (F6), F4 the controls menu (F4). In the menus: D-pad or left stick, A,
; B back (the engine's patch)
gamepad = f1=none, f2=none, f3=none, f4=none, l2=paddle3, r2=paddle2
keys = f1=escape, f2=f9, f3=f6, f4=f4
hint = R2  fire    L2  use    L1/R1  weapon    A  jump    B  crouch    X  flip weapon    Y  NETRICSA\nF1  menu    F2  quick load    F3  quick save    F5  minimise    F6 (hold)  quit
hint.ru = R2  огонь    L2  действие    L1/R1  оружие    A  прыжок    B  присесть    X  смена ствола    Y  ИНЕРТАН\nF1  меню    F2  загрузка    F3  сохранение    F5  свернуть    F6 (держать)  выйти
scale = fit
; 60 fps (the engine's own vsync holds it there too)
fps_limit = 60

[env]
SE1_DATA_DIR = {dir}
SE1_SCREEN_WIDTH = {width}
SE1_SCREEN_HEIGHT = {height}

[labels]
; what each control does, in bare_app's controls screen (controls.py)
stick = walk, menus
rstick = look
a = jump, choose
b = crouch, back
x = flip weapon
y = NETRICSA
l1 = previous weapon
r1 = next weapon
l2 = use
r2 = fire
up = serious bomb
down = 3rd person view
left = sniper zoom -
right = sniper zoom +
f1 = menu
f2 = quick load
f3 = quick save
f4 = controls menu

[labels.ru]
stick = ходьба, меню
rstick = обзор
a = прыжок, выбор
b = присесть, назад
x = смена ствола
y = ИНЕРТАН
l1 = прошлое оружие
r1 = следующее оружие
l2 = действие
r2 = огонь
up = серьёзная бомба
down = вид от 3-го лица
left = прицел снайпера -
right = прицел снайпера +
f1 = меню
f2 = быстрая загрузка
f3 = быстрое сохранение
f4 = управление
