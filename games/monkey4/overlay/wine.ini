; Tales of Monkey Island, chapter 4: The Trial and Execution of Guybrush
; Threepwood (2009, Telltale Tool, Direct3D 9) under Wine for the GO
; Ultra: the GOG edition, in Russian (games/monkey1/README.md); goes to
; /games/monkey4/wine.ini. The same engine and settings as chapter 1:
; games/monkey1/overlay/wine.ini explains them.
name = Tales of Monkey Island 4
hint = L stick  cursor    A  click    B  back (Esc)    Y  right click    D-pad / R stick  walk (arrows)\nX  Enter    R1  Space    F1  menu (Esc)    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор    A  клик    B  назад (Esc)    Y  правый клик    крестовина / П. стик  ходьба (стрелки)\nX  Enter    R1  пробел    F1  меню (Esc)    F5  свернуть    F6 (держать)  выход
exe = MonkeyIsland104.exe
mode = 800x600
rows = 450 75 800x600
locale = ru_RU
reg = HKLM\Software\Telltale Games\MonkeyIsland104.exe\Language=russian
reg = HKLM\Software\Telltale Games\MonkeyIsland104.exe\Language ID=1049
dlls = d3dx9_41=n,b
profile = profile
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,NoMultisample=1 WINE_D3D9_SHOW_LOST_SCENE=1
; The frame limit unless the game's options (Y on its tile) choose
; another, frames a second (none: no limit). 37-60 fps from scene to
; scene (monkey1/README.md): 30 keeps them even.
fps_limit = 30

[keys]
stick = mouse
dpad = arrows
rstick = arrows
cursor_speed = 1.2
a = lbutton
b = esc
x = enter
y = rbutton
f1 = esc
r1 = space

[labels]
stick = cursor
rstick = walk (arrows)
up = walk
down = walk
left = walk
right = walk
a = click
b = back, menu (Esc)
x = Enter
y = right click
r1 = Space
f1 = menu (Esc)

[labels.ru]
stick = курсор
rstick = ходьба (стрелки)
up = ходьба
down = ходьба
left = ходьба
right = ходьба
a = клик
b = назад, меню (Esc)
x = Enter
y = правый клик
r1 = пробел
f1 = меню (Esc)
