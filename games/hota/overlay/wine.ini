; Heroes of Might and Magic III: Horn of the Abyss (HotA 1.8 + HD mod 5),
; the original game under Wine, for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/hota/wine.ini.
name = Heroes III: HotA (Wine)
hint = L stick  cursor    R stick  scroll the map (magnifier: moves it)    D-pad  hero a step    A  click    B  right button (info)\nL1  magnifier 1:1 on/off    X  end turn    Y  next hero    R1  spell    L2/R2  Shift/Ctrl    F1  Esc    F2  Enter    F3  defend    F4  wait
hint.ru = Л. стик  курсор    П. стик  прокрутка карты (с лупой — двигает её)    Крестовина  шаг героя    A  клик    B  правая кнопка (сведения)\nL1  лупа 1:1 вкл/выкл    X  конец хода    Y  след. герой    R1  заклинание    L2/R2  Shift/Ctrl    F1  Esc    F2  Enter    F3  защита    F4  ждать
; The HD mod's exe (HotA's launcher only starts it)
exe = h3hota HD.exe
; The HD mod's resolution (_HD3_Data/Settings/hota.ini Graphics.Resolution,
; set by prepare.sh): as wide as the screen, 600 high (the least Heroes III
; takes), filling it: across at 1:1, down taken in 600 -> 480; L1 turns
; a 1:1 magnifier on and off. The HD mod's renderer 5 (32-bit GDI) needs
; no OpenGL.
mode = 854x600
scale = fill
locale = ru_RU
; Saved games (games), settings (_HD3_Data/Settings, HotA_*.ini), the random
; map generator's output and logs; patcher_x86's logs are created anew. The
; game opens its Data/*.lod read-write: Wine gives it read-only files on the
; read-only /games (SDK's Wine patch), no copy needed.
writable = games, _HD3_Data, random_maps, HotA_logs, HotA_Settings.ini, HotA_Setup.ini
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1

[keys]
; The cursor; the right stick scrolls the adventure map (the game's pointer
; at the screen's edge, as a mouse scrolls it); with the magnifier on it
; moves the magnifier first, then scrolls
stick = mouse
rstick = scroll
; Heroes III moves the selected hero a step with the arrow keys
dpad = arrows
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = rbutton
x = e
y = h
l1 = magnify
r1 = c
l2 = shift
r2 = ctrl
select = tab
start = esc
f1 = esc
f2 = enter
f3 = d
f4 = w
