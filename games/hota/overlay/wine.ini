; Heroes of Might and Magic III: Horn of the Abyss (HotA 1.8 + HD mod 5),
; the original game under Wine, for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/hota/wine.ini.
name = Heroes III: HotA (Wine)
hint = A  click    Y  right click (info)    B / F4  accept    X  end turn    R1  next hero\nL1  magnifier    D-pad / R stick  scroll the map (magnifier: move it)    F1  minimise\nF2  Ctrl (one off)    F3  Shift (split)    F5  cancel    L2 R2  volume    F6 (hold)  quit
hint.ru = A  клик    Y  правый клик (сведения)    B / F4  да    X  конец хода    R1  след. герой\nL1  лупа    Крестовина / П. стик  прокрутка карты (с лупой — двигают её)    F1  свернуть\nF2  Ctrl (одного)    F3  Shift (поровну)    F5  отмена    L2 R2  громкость    F6 (держать)  выйти
; The controls of Heroes III under VCMI on the GO Ultra: F1 minimises
; (bare_app), L2 and R2 are the volume
minimize = f1
volume = triggers
; The HD mod's exe (HotA's launcher only starts it)
exe = h3hota HD.exe
; The HD mod's resolution (_HD3_Data/Settings/hota.ini Graphics.Resolution,
; set by prepare.sh): as wide as the screen, 600 high (the least Heroes III
; takes), filling it: across at 1:1, down taken in 600 -> 480; L1 turns
; a 1:1 magnifier on and off. The HD mod's renderer 5 (32-bit GDI) needs
; no OpenGL.
mode = 854x600
scale = fill
locale = ru_RU
; Saved games (games), settings (_HD3_Data/Settings, HotA_*.ini), the random
; map generator's output and logs; patcher_x86's logs are created anew. The
; game opens its Data/*.lod read-write: Wine gives it read-only files on the
; read-only /games (SDK's Wine patch), no copy needed.
writable = games, _HD3_Data, random_maps, HotA_logs, HotA_Settings.ini, HotA_Setup.ini
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1

[keys]
; As VCMI on the GO Ultra: the left stick is the cursor, scrolling the map
; at the screen's edge only while it pushes there (the game's pointer stays
; edge_zone pixels in otherwise); the right stick and the D-pad scroll the
; map (the game's pointer at that edge), with the magnifier on they move it
; first. Heroes III scrolls while the pointer is within 16 pixels of the
; screen's edge (measured).
stick = mouse
rstick = scroll
dpad = scroll
edge_zone = 16
cursor_speed = 0.8
a = lbutton
y = rbutton
b = enter
x = e
r1 = h
l1 = magnify
f2 = ctrl
f3 = shift
f4 = enter
f5 = esc
select = tab
start = esc
