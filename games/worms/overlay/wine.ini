; Worms World Party Remastered (2015, Team17; the 2001 game remastered,
; Direct3D 9), GOG's edition, under Wine for the GO Ultra
; (games/worms/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/worms/wine.ini.
name = Worms World Party Remastered
hint = R stick  pointer, camera (menus: then A)    L stick, D-pad  walk, aim    R1  fire (hold: power)    A  click, choose, target    B  jump    X  back flip    Y  weapons    L1  next worm\nL2, R2  fuse -/+, turn a girder or a strike    F2, F3  bounce min/max    F1  menu    F5  minimise    F6 (hold)  quit
hint.ru = П. стик  указатель, камера (в меню — и A)    Л. стик, крестовина  ходьба, прицел    R1  огонь (держать — сила)    A  щелчок, выбор, цель    B  прыжок    X  сальто назад    Y  оружие    L1  следующий червяк\nL2, R2  запал -/+, поворот балки или удара    F2, F3  отскок мин./макс.    F1  меню    F5  свернуть    F6 (держать)  выход
exe = w2.exe
; The game's screen is 640x480: its menus and its match take the mouse in
; 640x480 (the pointer drawn and the clicks at X/640 of the picture's
; width). At 854x480 the pointer was drawn a third further right than the
; Windows cursor and left the screen once that passed x=640, a quarter of
; the stick's way; 640x480 is shown 1:1 between black bars
mode = 640x480
modes = 640x480
; What the game writes: its saves and user files (save/, user/, made from
; defaultSave on the first start) and the landscape the frontend makes for
; the match (data/land.dat: on the read-only card the match never started)
writable = save, user, data/land.dat
; Microsoft's D3DX 9.43 and its HLSL compiler (from Windows' SysWOW64, the
; manifest's file lines): the frontend's renderer builds data/Gfx/Fade.fx
; by D3DXCreateEffectFromFile, which Wine's own (vkd3d-shader) cannot
; compile (fx_2_0 sampler states and pass assignments "not yet
; implemented"); without the effect the frontend rebuilt its renderer ~35
; times a minute, never drew a frame and crashed after ~2 min
dlls = d3dx9_43,d3dcompiler_43=n,b
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; A match draws 85-90 fps, the menus ~45: 60 keeps it even and spares the
; battery
fps_limit = 60

[keys]
; The game's keyboard and mouse (the arrows walk and aim, Space fires,
; Enter jumps, Backspace flips back, the right button opens the weapons).
; The menus take only the mouse (no key moves or chooses there): the
; pointer on the right stick, A the left button, as in the other mouse
; games; R1 fires, as in the shooters. Any key hides the game's pointer
; until the mouse moves on (a few steps of the stick). The grenade's fuse
; (1-5 s) and bounce have no key that steps them (the keyboard sets them
; by 1..5, - and +): the game's own Xbox pad buttons for them (its pad
; layout, IDS_OPT_CONT_DESC07..10 in language/*.txt: LB/RB "Decrease /
; Increase Fuse, Rotate Girder, Aim Strike", LT/RT "Min / Max Grenade
; Bounce") are taken from bare_app_wine's pad, next to the keyboard and
; the mouse (checked in a match: "Grenade, 4 Sec, MAX Bounce")
stick = arrows
rstick = mouse
dpad = arrows
arrows = cursor
; the right stick's pointer (0.3 of this many screen widths a second at
; full deflection): 3.5 x 0.3 x 640 = 670 px a second, the left stick's
; pointer speed in the other mouse games (Fallout's 0.8 x 854), across the
; menus or a screen of the match's map in ~1 s (2.0 took 1.7 s, at half
; deflection ~10 s: "the mouse is too slow"); per-game stick sensitivity
; (Controls) still scales it
cursor_speed = 3.5
a = lbutton
b = enter
x = backspace
y = rbutton
r1 = space
l1 = tab
l2 = pad_lb
r2 = pad_rb
f1 = esc
f2 = pad_lt
f3 = pad_rt
f4 = none

[labels]
stick = walk, aim
rstick = pointer, camera
up = aim up
down = aim down
left = walk left
right = walk right
a = click, choose, target
b = jump
x = back flip (twice: high jump)
y = weapons panel
r1 = fire (hold: power)
l1 = next worm
l2 = fuse shorter, turn a girder or a strike
r2 = fuse longer, turn a girder or a strike
f1 = menu
f2 = bounce min
f3 = bounce max

[labels.ru]
stick = ходьба, прицел
rstick = указатель, камера
up = прицел выше
down = прицел ниже
left = влево
right = вправо
a = щелчок, выбор, цель
b = прыжок
x = сальто назад (дважды — высокий прыжок)
y = панель оружия
r1 = огонь (держать — сила)
l1 = следующий червяк
l2 = запал короче, поворот балки или удара
r2 = запал длиннее, поворот балки или удара
f1 = меню
f2 = отскок мин.
f3 = отскок макс.
