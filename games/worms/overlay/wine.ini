; Worms World Party Remastered (2015, Team17; the 2001 game remastered,
; Direct3D 9), GOG's edition, under Wine for the GO Ultra
; (games/worms/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/worms/wine.ini.
name = Worms World Party Remastered
hint = R stick  pointer (menus: then A)    L stick, D-pad  walk, aim    R1  fire (hold: power)    A  click, choose, target    B  jump    X  back flip    Y  weapons    L1  next worm\nF1  menu    F5  minimise    F6 (hold)  quit
hint.ru = П. стик  указатель (в меню — и A)    Л. стик, крестовина  ходьба, прицел    R1  огонь (держать — сила)    A  щелчок, выбор, цель    B  прыжок    X  сальто назад    Y  оружие    L1  следующий червяк\nF1  меню    F5  свернуть    F6 (держать)  выход
exe = w2.exe
; The game's screen is 640x480: its menus and its match take the mouse in
; 640x480 (the pointer drawn and the clicks at X/640 of the picture's
; width). At 854x480 the pointer was drawn a third further right than the
; Windows cursor and left the screen once that passed x=640, a quarter of
; the stick's way; 640x480 is shown 1:1 between black bars
mode = 640x480
modes = 640x480
; What the game writes: its saves and user files (save/, user/, made from
; defaultSave on the first start) and the landscape the frontend makes for
; the match (data/land.dat: on the read-only card the match never started)
writable = save, user, data/land.dat
; Microsoft's D3DX 9.43 and its HLSL compiler (from Windows' SysWOW64, the
; manifest's file lines): the frontend's renderer builds data/Gfx/Fade.fx
; by D3DXCreateEffectFromFile, which Wine's own (vkd3d-shader) cannot
; compile (fx_2_0 sampler states and pass assignments "not yet
; implemented"); without the effect the frontend rebuilt its renderer ~35
; times a minute, never drew a frame and crashed after ~2 min
dlls = d3dx9_43,d3dcompiler_43=n,b
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1
; A match draws 85-90 fps, the menus ~45: 60 keeps it even and spares the
; battery
fps_limit = 60

[keys]
; The game's keyboard and mouse (the arrows walk and aim, Space fires,
; Enter jumps, Backspace flips back, the right button opens the weapons).
; The menus take only the mouse (no key moves or chooses there): the
; pointer on the right stick, A the left button, as in the other mouse
; games; R1 fires, as in the shooters. Any key hides the game's pointer
; until the mouse moves on (a few steps of the stick)
stick = arrows
rstick = mouse
dpad = arrows
arrows = cursor
; the right stick's pointer at 2 x 0.3 of the screen a second: across
; the menus in under 2 s (at the default 0.8 it took ~5)
cursor_speed = 2.0
a = lbutton
b = enter
x = backspace
y = rbutton
r1 = space
l1 = tab
l2 = none
r2 = none
f1 = esc
f2 = none
f3 = none
f4 = none

[labels]
stick = walk, aim
rstick = pointer
up = aim up
down = aim down
left = walk left
right = walk right
a = click, choose, target
b = jump
x = back flip (twice: high jump)
y = weapons panel
r1 = fire (hold: power)
l1 = next worm
f1 = menu

[labels.ru]
stick = ходьба, прицел
rstick = указатель
up = прицел выше
down = прицел ниже
left = влево
right = вправо
a = щелчок, выбор, цель
b = прыжок
x = сальто назад (дважды — высокий прыжок)
y = панель оружия
r1 = огонь (держать — сила)
l1 = следующий червяк
f1 = меню
