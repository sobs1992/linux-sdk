; Fallout 2 (1998), the Russian "Fixed Edition" (sfall 5.0.5.4, the hi-res
; patch, the Restoration Project and Unofficial Patch, FE's translation;
; games/fallout/README.md) under Wine for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/fallout2/wine.ini.
name = Fallout 2
hint = L stick  cursor    D-pad  cursor, slowly    R stick  scroll the map    A  click    B  cursor mode\nX  inventory    Y  end turn    L1  other hand    R1  combat    L2  map    R2  character    F1  menu    F2  Pip-Boy    F3  save    F4  load
hint.ru = Л. стик  курсор    крестовина  курсор медленно    П. стик  прокрутка карты    A  клик    B  режим курсора\nX  инвентарь    Y  конец хода    L1  другая рука    R1  бой    L2  карта    R2  персонаж    F1  меню    F2  Пип-бой    F3  запись    F4  загрузка
exe = FALLOUT2_FE.exe
; The device's own screen: the hi-res patch (f2_res.ini and sfall's ddraw.ini, set by
; games/fallout/prepare.sh) draws the game at 854x480, a pixel a pixel
mode = 854x480
modes = 854x480
locale = ru_RU
; What the game writes: saved games, and the maps, scripts and protos of
; the places visited (data\maps...: what a save takes along), settings
writable = data/savegame, data/maps, data/proto, data/scripts, fallout2.cfg
; The mouse as moves: sfall reads it by DirectInput and moves the game's
; pointer by the moves only (the pointer stayed put where Fallout 1 took
; the place)
mouse = relative
; sfall: its ddraw.dll before Wine's
dlls = ddraw=n,b
; BOX64_DYNAREC_BIGBLOCK=0: the videos (Interplay's MVE decoder) write
; each 8x8 block's code into the code itself and jump there, in the same
; page; as one big block the stale code kept running and the videos fell
; apart into blocks. The game itself runs at 45-60 fps all the same.
env = BOX64_DYNAREC_BIGBLOCK=0

[keys]
; The mouse game of the PC with its keys (Ctrl-S/F4 save, Ctrl-L/F5
; load); the map scrolls with the arrow keys
stick = mouse
rstick = arrows
dpad = mouse
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = rbutton
x = i
y = space
l1 = b
r1 = a
l2 = tab
r2 = c
f1 = esc
f2 = p
f3 = f4
f4 = f5

[labels]
stick = cursor
rstick = scroll the map
a = click
b = cursor mode
x = inventory
y = end turn
l1 = other hand
r1 = combat
l2 = map
r2 = character
f1 = menu
f2 = Pip-Boy
f3 = save
f4 = load

[labels.ru]
stick = курсор
rstick = прокрутка карты
a = клик
b = режим курсора
x = инвентарь
y = конец хода
l1 = другая рука
r1 = бой
l2 = карта
r2 = персонаж
f1 = меню
f2 = Пип-бой
f3 = запись
f4 = загрузка
