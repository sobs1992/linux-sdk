; Fallout 2 (1998), the Russian "Fixed Edition" (sfall 5.0.5.4, the hi-res
; patch, the Restoration Project and Unofficial Patch, FE's translation;
; games/fallout/README.md) under Wine for the GO Ultra. bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/fallout2/wine.ini.
name = Fallout 2
hint = L stick  cursor    D-pad  slowly    R stick  scroll    A  click, skip a video    B  back (in the main menu: quit!)\nY  cursor mode (fight: aim, then A)    X  inventory    L1  Enter    R1  end turn    L2  map    R2  character\nF1  menu    F2  load    F3  save, then L1 L1 (over a save: L1 L1 L1)    F4  Pip-Boy
hint.ru = Л. стик  курсор    крестовина  медленно    П. стик  прокрутка    A  клик, пропуск ролика    B  назад (в главном меню — выход!)\nY  режим курсора (бой: прицел, затем A)    X  инвентарь    L1  Enter    R1  конец хода    L2  карта    R2  персонаж\nF1  меню    F2  загрузка    F3  запись, затем L1 L1 (поверх: L1 L1 L1)    F4  Пип-бой
exe = FALLOUT2_FE.exe
; The device's own screen: the hi-res patch (f2_res.ini and sfall's ddraw.ini, set by
; games/fallout/prepare.sh) draws the game at 854x480, a pixel a pixel
mode = 854x480
modes = 854x480
locale = ru_RU
; What the game writes: saved games, and the maps, scripts and protos of
; the places visited (data\maps...: what a save takes along), settings
writable = data/savegame, data/maps, data/proto, data/scripts, fallout2.cfg
; The mouse as moves: sfall reads it by DirectInput and moves the game's
; pointer by the moves only (the pointer stayed put where Fallout 1 took
; the place)
mouse = relative
; sfall: its ddraw.dll before Wine's
dlls = ddraw=n,b
; The videos: Interplay's MVE decoder writes each 8x8 block's code into
; the code itself and jumps there, in the same page. In big blocks Box64
; kept running the stale code (the videos fell apart into blocks); in one
; block a jump (BIGBLOCK=0) it saw every change but compiled the code
; again for each block, and the intro fell to ~4 fps, its music broken
; off. The decoder's code (0x4f7000-0x4fd000) is interpreted instead, the rest
; compiled in big blocks: the videos at their own 15 fps, sound unbroken.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 BOX64_NODYNAREC=0x4f7000-0x4fd000
; No frame limit by default: the game draws by DirectDraw a piece at a
; time (the cursor taken off and put back, each a frame to Wine): 45-60
; frames a second on the map, ~150 while the cursor moves. A limit of 30
; held each piece back, the game slowed down and the cursor flickered.
fps_limit = none
; Esc in the main menu quits at once: B, B over the videos closed the
; game. B and F1 do nothing for the first 30 s (A skips the videos)
esc_delay = 30

[keys]
; The mouse game of the PC with its keys; the map scrolls with the arrow
; keys. Its quick save and load (F6/F7) do not answer in this build (FE
; 5.0.5.4: neither by a USB keyboard nor after a save), so F2/F3 open the
; load and save screens (F5/F4), and L1 is Enter: F3, L1 (the slot), L1
; (its description) saves, no text to type; over a save, L1 once more
; (overwrite? yes). The other hand: the panel's
; button
stick = mouse
rstick = arrows
dpad = mouse
arrows = cursor
cursor_speed = 0.8
a = lbutton
b = esc
x = i
y = rbutton
l1 = enter
r1 = space
l2 = tab
r2 = c
f1 = esc
f2 = f5
f3 = f4
f4 = p

[labels]
stick = cursor
rstick = scroll the map
up = cursor, slowly
down = cursor, slowly
left = cursor, slowly
right = cursor, slowly
a = click, skip a video
b = back, menu (Esc; the main menu: quit)
y = cursor mode (right click; fight: to the target)
x = inventory
l1 = Enter (save: F3, L1, L1; over a save one more)
r1 = end turn
l2 = map
r2 = character
f1 = menu (save, load)
f2 = load
f3 = save (then L1, L1)
f4 = Pip-Boy

[labels.ru]
stick = курсор
rstick = прокрутка карты
up = курсор медленно
down = курсор медленно
left = курсор медленно
right = курсор медленно
a = клик, пропуск ролика
b = назад, меню (Esc; в главном меню — выход)
y = режим курсора (правый клик; бой: прицел)
x = инвентарь
l1 = Enter (запись: F3, L1, L1; поверх — ещё L1)
r1 = конец хода
l2 = карта
r2 = персонаж
f1 = меню (запись, загрузка)
f2 = загрузка
f3 = запись (затем L1, L1)
f4 = Пип-бой
