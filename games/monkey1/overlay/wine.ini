; Tales of Monkey Island, chapter 1: Launch of the Screaming Narwhal
; (2009, Telltale Tool, Direct3D 9) under Wine for the GO Ultra: the GOG
; edition, in Russian (games/monkey1/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/monkey1/wine.ini. Chapters 2-5 have the same settings.
name = Tales of Monkey Island 1
hint = L stick  cursor    A  click    B  right click    D-pad / R stick  walk (arrows)\nX  Enter    Y  Space    F1  menu (Esc)    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор    A  клик    B  правый клик    крестовина / П. стик  ходьба (стрелки)\nX  Enter    Y  пробел    F1  меню (Esc)    F5  свернуть    F6 (держать)  выход
exe = MonkeyIsland101.exe
; GOG's program starts the game itself, without Telltale's launcher.
mode = 800x600
; The game draws its 16:9 picture between black bars: at 800x600 (chosen
; in its Settings > Graphics) in rows 75-524, shown alone on the whole
; 854x480 screen, nearly 1:1: its text much sharper than at 640x480
; (640x360 stretched), ~4 % slower; 1024x768 costs a third of the speed.
rows = 450 75 800x600
locale = ru_RU
; The language of the text: the engine reads it from what the installer
; writes (GOG's: english); its Russian is in the archives already
; (russian.langdb). Without it the menus and subtitles are English.
reg = HKLM\Software\Telltale Games\MonkeyIsland101.exe\Language=russian
reg = HKLM\Software\Telltale Games\MonkeyIsland101.exe\Language ID=1049
; The game's own D3DX 9.41
dlls = d3dx9_41=n,b
; Box64's x86 code in big blocks, CALL/RET without its jump table. Not
; SAFEFLAGS=0: the game then loses characters (Guybrush, LeChuck are not
; drawn and the camera goes elsewhere: its code wants flags across RET);
; FORWARD=1024 gains nothing, X87DOUBLE=1 is slower.
; WineD3D: DISCARD/NOOVERWRITE maps without the render thread (HeapMaps),
; and the game's D3DPOOL_SYSTEMMEM index buffers, which d3d9 reads on each
; of its ~850 draws a frame, read without it either (SysmemMaps, Wine
; patch 0018) and drawn from a copy updated when written (patch 0019).
; NoMultisample (patch 0021): the GOG edition takes a multisampled back
; buffer when offered one; its first scene (Continue from the prologue's
; autosave) at 800x600, quality 7: 19 fps with it, 39 without.
; At quality 1-6 (Settings > Graphics; a new chapter starts at 1) this
; edition draws its scene into a texture and never puts that texture on
; the screen, only its rain and text: black (seen in its d3d9 calls).
; WINE_D3D9_SHOW_LOST_SCENE (patch 0022) copies such a texture to the
; screen; quality 7 and above draw the scene themselves and are left
; alone. Quality 1 and 7 ran alike there (~40 fps in the first scene).
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,NoMultisample=1 WINE_D3D9_SHOW_LOST_SCENE=1

[keys]
stick = mouse
dpad = arrows
rstick = arrows
cursor_speed = 1.2
a = lbutton
b = rbutton
x = enter
y = space
f1 = esc
