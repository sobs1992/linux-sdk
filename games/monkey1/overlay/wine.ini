; Tales of Monkey Island, chapter 1: Launch of the Screaming Narwhal
; (2009, Telltale Tool, Direct3D 9), Russian edition, under Wine for the
; GO Ultra. bare_app_wine's settings (apps/bare_app/ports/wine/wine.ini
; explains every key); goes to /games/monkey1/wine.ini.
name = Tales of Monkey Island 1
hint = L stick  cursor    A  click    B  right click    D-pad / R stick  walk (arrows)\nX  Enter    Y  Space    F1  menu (Esc)    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор    A  клик    B  правый клик    крестовина / П. стик  ходьба (стрелки)\nX  Enter    Y  пробел    F1  меню (Esc)    F5  свернуть    F6 (держать)  выход
exe = MonkeyIsland101.exe
; It always opens Telltale's launcher first, an HTML page (mshtml):
; it needs Wine Gecko in the prefix (games/monkey1/README.md) and the
; SDK's Wine patch 0016 for its buttons. The launcher is 700x480 with its
; frame: the desktop is 800x600 so that it fits, scaled down.
mode = 800x600
locale = ru_RU
; The game's own D3DX 9.41
dlls = d3dx9_41=n,b
; Box64's x86 code in big blocks, CALL/RET without its jump table and
; without flags (SAFEFLAGS=0), blocks across forward jumps up to 1 KiB.
; WineD3D: DISCARD/NOOVERWRITE maps without the render thread (HeapMaps),
; and the game's D3DPOOL_SYSTEMMEM index buffers, which d3d9 reads on each
; of its ~850 draws a frame, read without it either (SysmemMaps with Wine
; patch 0018). The first scene (Continue from the prologue's autosave) at
; 640x480: 9.6 fps before, 17 fps now at quality 9, 26 fps at quality 1
; (Settings > Graphics, Apply). The game's own x86 code is then what is
; left: ~30 ms of the ~38 ms frame, on one core. X87DOUBLE=1 is slower.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 BOX64_DYNAREC_SAFEFLAGS=0 BOX64_DYNAREC_FORWARD=1024 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1

[keys]
stick = mouse
dpad = arrows
rstick = arrows
cursor_speed = 1.2
a = lbutton
b = rbutton
x = enter
y = space
f1 = esc
