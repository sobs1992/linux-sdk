; Swashbucklers: Blue vs. Grey (2007, Akella, Direct3D 9), 1C's Russian
; edition «Головорезы: Корсары XIX века», under Wine for the GO Ultra
; (games/swash/README.md). bare_app_wine's settings
; (apps/bare_app/ports/wine/wine.ini explains every key); goes to
; /games/swash/wine.ini.
name = Swashbucklers: Blue vs. Grey
hint = L stick  walk, steer    R stick  pointer    R1  attack, fire, click    L1  shooting mode, low blow    A  action, block    B  menu (Esc)    X  switch cannon    Y  steam engine\nL2/R2  perks, aim, super blows    D-pad  sails up/down, perks    F1  menu    F4  character    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  ходьба, руль    П. стик  указатель    R1  атака, огонь, щелчок    L1  стрельба, нижний удар    A  действие, блок    B  меню (Esc)    X  сменить орудие    Y  паровая машина\nL2/R2  перки, прицел, суперудары    крестовина  паруса, перки    F1  меню    F4  персонаж    F5  свернуть    F6 (держать)  выход
exe = Swashbucklers.exe
; its saved games and settings in the Windows profile (the options screen
; deletes them with "Delete saved games and settings")
saves = Documents/My Games/Swashbucklers
; The game's 854x480 (16:9), set in its settings file (profile/)
mode = 854x480
modes = 854x480
locale = ru_RU
; Its settings file: 854x480, the post effects off (Documents/My
; Games/Swashbucklers/settings, written by its options screen)
profile = profile
dlls = msvcp71,msvcr71,mfc71=n,b
; BOX64_DYNAREC_SAFEFLAGS=2: without it the game never sees the end of
; its CSV files (rstream::eof, XRes/ships/ships.csv) and recurses until
; its stack overflows (clx.dll) before the main menu
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 BOX64_DYNAREC_SAFEFLAGS=2 WINE_D3D_CONFIG=HeapMaps=1,SysmemMaps=1,GLStateCache=1 WINE_FAST_MUTEX=1

[keys]
; The game's keys (its options' Controls screen): W A S D walk and steer
; the ship, the mouse attacks and aims
stick = arrows
stick_up = w
stick_down = s
stick_left = a
stick_right = d
rstick = mouse
dpad = arrows
up = r
down = f
left = ctrl
right = alt
a = space
b = esc
x = tab
y = lshift
l1 = rbutton
r1 = lbutton
l2 = q
r2 = e
f1 = esc
f2 = none
f3 = none
f4 = i

[labels]
stick = walk, steer the ship
rstick = pointer, aim
up = sails up
down = sails down
left = perk (Ctrl)
right = perk (Alt)
a = action, talk, block (boxing)
b = menu (Esc)
x = switch cannon
y = steam engine
l1 = shooting mode, low blow
r1 = attack, fire, click
l2 = perk, aim farther, super blow 1
r2 = perk, aim closer, super blow 2
f1 = menu
f4 = character

[labels.ru]
stick = ходьба, руль корабля
rstick = указатель, прицел
up = поднять паруса
down = опустить паруса
left = перк (Ctrl)
right = перк (Alt)
a = действие, разговор, блок (бокс)
b = меню (Esc)
x = сменить орудие
y = паровая машина
l1 = режим стрельбы, нижний удар
r1 = атака, огонь, щелчок
l2 = перк, прицел дальше, суперудар 1
r2 = перк, прицел ближе, суперудар 2
f1 = меню
f4 = персонаж
