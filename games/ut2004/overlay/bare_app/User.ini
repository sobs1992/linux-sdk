; Put over the game's DefUser.ini at its first start (/usr/bin/ut2004):
; the keys bare_app's buttons become (the game.ini's keys) and the sticks
; (the joystick's axes: the left stick X and Y, the right one Z and R).
; Tab (the D-pad's down: the menus' next item) does nothing in a match
; (the game's own: Type)
[Engine.Input]
Enter=Jump
Escape=ShowMenu
C=Duck
E=Use
J=Fire
K=AltFire
N=NextWeapon
B=PrevWeapon
F1=ShowScores
G=SwitchToBestWeapon
Q=SwitchWeapon 10
Up=MoveForward
Tab=
Left=StrafeLeft
Right=StrafeRight
JoyX=Axis aStrafe SpeedBase=300.0 DeadZone=0.15
JoyY=Axis aBaseY SpeedBase=300.0 DeadZone=0.15 Invert=-1
; the right stick: full tilt turns ~180 degrees a second (a SpeedBase
; unit is ~3.6 deg/s, measured on the GO Ultra), up and down ~120
JoyZ=Axis aBaseX SpeedBase=50.0 DeadZone=0.1
JoyR=Axis aLookUp SpeedBase=33.0 DeadZone=0.1 Invert=-1
