; Unreal Tournament 2004, its own Linux build (x86_64, System/ut2004-bin)
; run by Box64 (package ut2004: /usr/bin/ut2004, bare-app.UT2004=y): SDL
; 1.2 by sdl12-compat over SDL2's bareapp driver, OpenGL by the GPU,
; OpenAL. Game files in this directory, /games/ut2004 (as the DVD's Linux
; installer leaves them); settings and saved games in
; /data/ut2004/.ut2004. On the games card with the game
; (games/games.manifest: overlay), as bare_app/ here: the game's settings
; on the board, put over its own at its first start (the screen, the
; gamepad's axes, the keys of the buttons).
name = Unreal Tournament 2004
exe = /usr/bin/ut2004
args = -w {width} -h {height}
needs = System/ut2004-bin
needs = System/Default.ini
; the left stick: the game's joystick (UseJoystick, User.ini's JoyX and
; JoyY); the right stick: the mouse ([env]), the game's menus are made for
; a pointer (the keys only go forward through them, by Tab): there it
; moves the pointer, in a match it turns as a mouse does (full tilt ~180
; degrees a second, measured on the GO Ultra); the buttons: keys and the
; mouse's left button (User.ini binds them), not the joystick's
gamepad = up=none, down=none, left=none, right=none, a=none, b=none, x=none, y=none, l1=none, r1=none, l2=none, r2=none, f1=none, f2=none, f3=none, f4=none, select=none, start=none
; R1 fire (J), L1 alt fire (K), R2/L2 next/previous weapon (N, B), A the
; mouse's left button (a click in the menus, jump in a match), B back and
; the menu (Escape), X crouch (C), Y use (E), the D-pad the arrows (in a
; match walking; in the menus lists, sliders, choices), F1 the menu, F2
; the scores (F1), F3 the best weapon (G), F4 the translocator (Q)
keys = up=Up, down=Down, left=Left, right=Right, a=lbutton, b=Escape, x=C, y=E, r1=J, l1=K, r2=N, l2=B, f1=Escape, f2=F1, f3=G, f4=Q
hint = Right stick  look, pointer in menus    A  jump, click    B  menu / back\nR1  fire    L1  alt fire    L2/R2  weapon    X  crouch    Y  use    F2  scores    F4  translocator    F6 (hold)  quit
hint.ru = Правый стик  обзор, курсор в меню    A  прыжок, клик    B  меню / назад\nR1  огонь    L1  доп. огонь    L2/R2  оружие    X  присесть    Y  действие    F2  счёт    F4  транслокатор    F6 (держать)  выйти
scale = fit
fps = 0

[env]
SDL_BAREAPP_MOUSE = rstick

[labels]
stick = walk
rstick = look, pointer
a = jump, click
b = menu, back
x = crouch
y = use
l1 = alt fire
r1 = fire
l2 = previous weapon
r2 = next weapon
up = forward, lists
down = back, lists
left = strafe left, lists
right = strafe right, lists
f1 = menu
f2 = scores
f3 = best weapon
f4 = translocator

[labels.ru]
stick = ходьба
rstick = обзор, курсор
a = прыжок, клик
b = меню, назад
x = присесть
y = действие
l1 = доп. огонь
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = вперёд, списки
down = назад, списки
left = влево, списки
right = вправо, списки
f1 = меню
f2 = счёт
f3 = лучшее оружие
f4 = транслокатор
