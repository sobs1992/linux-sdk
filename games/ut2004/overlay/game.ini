; Unreal Tournament 2004, its own Linux build (x86_64, System/ut2004-bin)
; run by Box64 (package ut2004: /usr/bin/ut2004, bare-app.UT2004=y): SDL
; 1.2 by sdl12-compat over SDL2's bareapp driver, OpenGL by the GPU,
; OpenAL. Game files in this directory, /games/ut2004 (as the DVD's Linux
; installer leaves them); settings and saved games in
; /data/ut2004/.ut2004. On the games card with the game
; (games/games.manifest: overlay), as bare_app/ here: the game's settings
; on the board, put over its own at its first start (the screen, the
; gamepad's axes, the keys of the buttons).
name = Unreal Tournament 2004
exe = /usr/bin/ut2004
args = -w {width} -h {height}
needs = System/ut2004-bin
needs = System/Default.ini
; the sticks: the game's joystick (UseJoystick, User.ini's JoyX...); the
; buttons: keys (User.ini binds them), not the joystick's
gamepad = up=none, down=none, left=none, right=none, a=none, b=none, x=none, y=none, l1=none, r1=none, l2=none, r2=none, f1=none, f2=none, f3=none, f4=none, select=none, start=none
; R1 fire (J), L1 alt fire (K), R2/L2 next/previous weapon (N, B), A jump
; and choose (Return), B back and the menu (Escape), X crouch (C), Y use
; (E), the D-pad's down Tab (the menus' next item, round: the game's
; menus do not go by the arrows), the other three the arrows (in a match
; forward and strafe; lists, sliders), F1 the menu, F2 the scores (F1), F3
; the best weapon (G), F4 the translocator (Q)
keys = up=Up, down=Tab, left=Left, right=Right, a=Return, b=Escape, x=C, y=E, r1=J, l1=K, r2=N, l2=B, f1=Escape, f2=F1, f3=G, f4=Q
hint = R1  fire    L1  alt fire    L2/R2  weapon    A  jump    B  menu / back    X  crouch    Y  use\nF2  scores    F3  best weapon    F4  translocator    F5  minimise    F6 (hold)  quit
hint.ru = R1  огонь    L1  доп. огонь    L2/R2  оружие    A  прыжок    B  меню / назад    X  присесть    Y  действие\nF2  счёт    F3  лучшее оружие    F4  транслокатор    F5  свернуть    F6 (держать)  выйти
scale = fit
fps = 0

[labels]
stick = walk
rstick = look
a = jump, choose
b = menu, back
x = crouch
y = use
l1 = alt fire
r1 = fire
l2 = previous weapon
r2 = next weapon
up = forward
down = next menu item
left = strafe left, menus
right = strafe right, menus
f1 = menu
f2 = scores
f3 = best weapon
f4 = translocator

[labels.ru]
stick = ходьба
rstick = обзор
a = прыжок, выбор
b = меню, назад
x = присесть
y = действие
l1 = доп. огонь
r1 = огонь
l2 = прошлое оружие
r2 = следующее оружие
up = вперёд
down = следующий пункт меню
left = влево, меню
right = вправо, меню
f1 = меню
f2 = счёт
f3 = лучшее оружие
f4 = транслокатор
